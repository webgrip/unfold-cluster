[env]
KUBECONFIG = "{{config_root}}/access/unfold-oidc.kubeconfig.yaml"

[tools]
uv = "0.12.24"
"aqua:kubernetes/kubectl" = "1.37.1"
"aqua:int128/kubelogin" = "1.36.4"
"aqua:derailed/k9s" = "0.50.18"

[tasks.agents-install]
run = "uvx --from 'git+https://forgejo.webgrip.dev/webgrip/agent-standards.git@v0.3.2#subdirectory=cli' agentstd install"
description = "Install the agent-standards packages pinned in apm.yml and compile .apm into .claude/rules and AGENTS.md"

[tasks.agents-check]
run = "uvx --from 'git+https://forgejo.webgrip.dev/webgrip/agent-standards.git@v0.3.2#subdirectory=cli' agentstd check"
description = "Fail when a generated agent file differs from .apm and apm.lock.yaml, CLAUDE.md imports anything, or the session budget is exceeded"
