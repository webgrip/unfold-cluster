---
name: runtime-security-check

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - kubernetes/platform/runtime-security/**
      - kubernetes/platform/observability/vector/**
      - tests/runtime-security/**
      - scripts/test-runtime-security.sh
      - .forgejo/workflows/runtime-security-check.yml
  workflow_dispatch:

jobs:
  checks:
    runs-on: docker
    container:
      image: harbor.webgrip.dev/webgrip/infra-runner:0.2.0@sha256:c0703b8eb5a037ab3d0d2260a3c2aa13e09de4c4007da04504d6e01801a7fee7
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check the chart digest, the policies against the CRD schema, every policy's mode and the Vector records, and prove each check fails when broken
        run: ./scripts/test-runtime-security.sh --mutation-test
