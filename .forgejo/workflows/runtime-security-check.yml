---
name: runtime-security-check

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - kubernetes/platform/runtime-security/**
      - scripts/test-runtime-security.sh
      - .forgejo/workflows/runtime-security-check.yml
  workflow_dispatch:

jobs:
  checks:
    runs-on: unfold-check
    steps:
      - uses: https://forgejo.webgrip.dev/actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check the chart digest, the policies against the CRD schema and every policy's mode, and prove each check fails when broken
        run: ./scripts/test-runtime-security.sh --mutation-test
