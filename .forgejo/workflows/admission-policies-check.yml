---
name: admission-policies-check

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - kubernetes/platform/admission-policies/**
      - tests/admission-policies/**
      - scripts/test-admission-policies.sh
      - .forgejo/workflows/admission-policies-check.yml
  workflow_dispatch:

jobs:
  fixtures:
    runs-on: docker
    container:
      image: harbor.webgrip.dev/webgrip/infra-runner:0.2.0@sha256:c0703b8eb5a037ab3d0d2260a3c2aa13e09de4c4007da04504d6e01801a7fee7
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Refuse every refused fixture, admit every admitted one, and prove each policy is what refuses
        run: ./scripts/test-admission-policies.sh --mutation-test
