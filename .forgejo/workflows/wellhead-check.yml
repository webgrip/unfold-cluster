---
name: wellhead-check

on:
  pull_request:
    paths:
      - kubernetes/**
      - scripts/check-wellhead.sh
      - scripts/wellhead.sh
      - .forgejo/workflows/wellhead-check.yml
  push:
    branches:
      - main
    paths:
      - kubernetes/**
      - scripts/check-wellhead.sh
      - scripts/wellhead.sh
      - .forgejo/workflows/wellhead-check.yml
  workflow_dispatch:

jobs:
  lint:
    runs-on: unfold-check
    steps:
      - uses: https://forgejo.webgrip.dev/actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Refuse an ExternalSecret that does not say where its value comes from
        run: ./scripts/check-wellhead.sh --mutation-test
