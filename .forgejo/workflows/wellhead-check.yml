---
name: wellhead-check

on:
  pull_request:
    paths:
      - kubernetes/**
      - scripts/check-wellhead.sh
      - scripts/wellhead.sh
      - .forgejo/workflows/wellhead-check.yml
  push:
    branches:
      - main
    paths:
      - kubernetes/**
      - scripts/check-wellhead.sh
      - scripts/wellhead.sh
      - .forgejo/workflows/wellhead-check.yml
  workflow_dispatch:

jobs:
  lint:
    runs-on: docker
    container:
      image: harbor.webgrip.dev/webgrip/infra-runner:0.2.0@sha256:c0703b8eb5a037ab3d0d2260a3c2aa13e09de4c4007da04504d6e01801a7fee7
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Refuse an ExternalSecret that does not say where its value comes from
        run: ./scripts/check-wellhead.sh --mutation-test
