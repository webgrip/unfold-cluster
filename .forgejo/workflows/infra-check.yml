---
name: infra-check

on:
  pull_request:
    paths:
      - infra/**
      - scripts/*tailnet*
      - scripts/*headscale*
      - .forgejo/workflows/infra.yml
      - .forgejo/workflows/infra-check.yml
      - kubernetes/clusters/main/**
      - kubernetes/platform/cilium/**
      - kubernetes/platform/hcloud-cloud-controller-manager/**
      - kubernetes/platform/hetzner-charts/**
      - kubernetes/platform/flux-operator/**
      - kubernetes/platform/flux-instance/**
      - kubernetes/platform/etcd-backup/namespace.yaml
      - scripts/write-cluster-secrets.sh
      - scripts/encrypt-node.sh
      - scripts/disk-kms-key.sh
      - scripts/guard-encryption-rollout.sh
      - scripts/mask-hcloud-token-prefixes.sh
      - scripts/test-mask-hcloud-token-prefixes.sh
      - scripts/diagnose-cluster.sh
      - scripts/openbao-kv.sh
      - scripts/lift-headscale-protection.sh
      - scripts/set-etcd-backup-lifecycle.sh
      - scripts/plan-digest.sh
      - scripts/tofu-plan.sh
      - scripts/rebuild-drill.sh
      - scripts/test-*.sh
      - .forgejo/workflows/rebuild-drill.yml

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  check:
    runs-on: docker
    container:
      image: harbor.webgrip.dev/webgrip/infra-runner:0.1.0@sha256:d98987878aa40983b26ac4aa23dde1f105edd72dc4721d85fa18436b5db07140
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Format
        run: tofu fmt -check -recursive

      - name: Init without the state backend
        run: tofu init -backend=false

      - name: Validate
        run: tofu validate

      - name: Test against mocked providers
        run: tofu test

      - name: Test the program OpenTofu runs on unfold-headscale
        working-directory: .
        run: ./scripts/test-tailnet-key-tool.sh

      - name: Test the disk-encryption re-install against a stubbed cluster, mutants included
        working-directory: .
        run: ./scripts/test-encrypt-node.sh

      - name: Test the one-node-per-plan rollout guard, mutants included
        working-directory: .
        run: ./scripts/test-guard-encryption-rollout.sh

      - name: Test that the disk KMS master key is minted once and never replaced, mutants included
        working-directory: .
        run: ./scripts/test-disk-kms-key.sh

      - name: Test that the escrowed Talos secrets restore the same cluster identity
        working-directory: .
        run: ./scripts/test-talos-secrets-escrow.sh

      - name: Test that a minted tailnet key leaves the plan digest alone
        working-directory: .
        run: ./scripts/test-plan-digest.sh

      - name: Test that a plan is retried only after a Hetzner 5xx
        working-directory: .
        run: ./scripts/test-tofu-plan.sh

      - name: Test the OpenBao reads and writes of the apply
        working-directory: .
        run: ./scripts/test-openbao-kv.sh

      - name: Test that only a planned replacement of unfold-headscale lifts its protection
        working-directory: .
        run: ./scripts/test-lift-headscale-protection.sh

      - name: Test the etcd backup bucket's lifecycle rule
        working-directory: .
        run: ./scripts/test-set-etcd-backup-lifecycle.sh

      - name: Test the rebuild drill's guard and teardown
        working-directory: .
        run: ./scripts/test-rebuild-drill.sh


  token-mask-canary:
    runs-on: docker
    container:
      image: harbor.webgrip.dev/webgrip/infra-runner:0.1.0@sha256:d98987878aa40983b26ac4aa23dde1f105edd72dc4721d85fa18436b5db07140
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Test the masks against the runner's replacement rules
        run: ./scripts/test-mask-hcloud-token-prefixes.sh

      - name: Make a fake Hetzner token for this run
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf 'unfold-cluster mask canary %s' "${GITHUB_RUN_ID}" | sha256sum | cut -d' ' -f1)"
          echo "HCLOUD_TOKEN=${token}" >> "${GITHUB_ENV}"

      - name: Mask it the way plan-or-apply does
        run: ./scripts/mask-hcloud-token-prefixes.sh

      - name: Print what Hetzner prints when it refuses the token
        shell: bash
        run: |
          echo "Error: Limit of '3600' requests per hour for token '${HCLOUD_TOKEN:0:32}...' reached. (rate_limit_exceeded)"
          echo "Authorization: Bearer ${HCLOUD_TOKEN}"

  token-mask-proof:
    needs: token-mask-canary
    runs-on: docker
    container:
      image: harbor.webgrip.dev/webgrip/infra-runner:0.1.0@sha256:d98987878aa40983b26ac4aa23dde1f105edd72dc4721d85fa18436b5db07140
    steps:
      - name: Read the canary's public log and refuse any trace of its token
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf 'unfold-cluster mask canary %s' "${GITHUB_RUN_ID}" | sha256sum | cut -d' ' -f1)"
          log="${RUNNER_TEMP}/token-mask-canary.log"
          jobs_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_NUMBER}/jobs"
          canary_job=""
          for wait_round in 1 2 3 4 5 6; do
            for job in 0 1 2 3 4 5; do
              curl -fsS -o "$log" "${jobs_url}/${job}/attempt/1/logs" || continue
              if [[ "$(head -n 1 "$log")" == *"of job token-mask-canary,"* ]]; then
                canary_job="$job"
                break 2
              fi
            done
            echo "no canary log yet (round ${wait_round}); waiting"
            sleep 10
          done
          [ -n "$canary_job" ] || { echo "::error::found no log of job token-mask-canary under ${jobs_url}"; exit 1; }
          echo "the canary is job ${canary_job}: ${jobs_url}/${canary_job}/attempt/1/logs"
          if grep -qF "${token:0:16}" "$log"; then
            echo "::error::the canary's public log shows its fake token's first 16 characters; the masks did not apply"
            exit 1
          fi
          grep -qF "for token '***...' reached" "$log" || { echo "::error::the canary's 429 line is missing or not masked as '***...'"; exit 1; }
          grep -qF "Authorization: Bearer ***" "$log" || { echo "::error::the canary's whole-token line is missing or not masked"; exit 1; }
          echo "the public log shows the fake token only as ***"
