---
name: infra-check

on:
  pull_request:
    paths:
      - infra/**
      - .forgejo/workflows/infra.yml
      - .forgejo/workflows/infra-check.yml
      - kubernetes/clusters/main/**
      - kubernetes/platform/cilium/**
      - kubernetes/platform/hcloud-cloud-controller-manager/**
      - kubernetes/platform/hetzner-charts/**

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  check:
    runs-on: docker
    container:
      image: harbor.webgrip.dev/webgrip/infra-runner:0.1.0@sha256:d98987878aa40983b26ac4aa23dde1f105edd72dc4721d85fa18436b5db07140
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Format
        run: tofu fmt -check -recursive

      - name: Init without the state backend
        run: tofu init -backend=false

      - name: Validate
        run: tofu validate

      - name: Test against mocked providers
        run: tofu test

