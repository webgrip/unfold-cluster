    paths:
      - apm.yml
      - apm.lock.yaml
      - .agentstd.toml
      - ".apm/**"
      - AGENTS.md
      - "**/AGENTS.md"
      - CLAUDE.md
      - ".claude/**"
      - ".agents/**"
      - ".codex/**"
      - .mcp.json
      - opencode.json
      - .forgejo/workflows/agents-check.yml

jobs:
  agents-check:
    uses: webgrip/workflows/.forgejo/workflows/agents-check.yml@1998bc1c507e5f35e88aea7898a598a92488bb2a # v3.4.0
