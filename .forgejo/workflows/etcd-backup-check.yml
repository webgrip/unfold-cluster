---
name: etcd-backup-check

on:
  schedule:
    - cron: "40 7 * * *"
  workflow_dispatch:
    inputs:
      corrupt:
        description: Choose "corrupt" to damage the snapshot after download and prove the check fails
        required: true
        type: choice
        options:
          - "no"
          - corrupt
        default: "no"

concurrency:
  group: etcd-backup-check
  cancel-in-progress: false

env:
  BUCKET: unfold-cluster-etcd
  PREFIX: unfold-main
  MAX_AGE_HOURS: "7"
  S3_ENDPOINT: ${{ vars.STATE_ENDPOINT }}
  S3_REGION: ${{ vars.STATE_REGION }}

jobs:
  restore-latest-snapshot:
    if: vars.ETCD_BACKUP_CHECK == 'enabled'
    # Host mode on the unfold-infra pool: the steps run in its toolchain image, infra-runner from
    # webgrip/infrastructure, which carries age and the etcd tools pinned and checksum-verified.
    runs-on: unfold-infra
    enable-openid-connect: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read the restore credentials from OpenBao
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/openbao-read@1998bc1c507e5f35e88aea7898a598a92488bb2a # v3.4.0
        with:
          role: ${{ github.event_name == 'schedule' && 'ci-unfold-cluster-etcd-check' || 'ci-unfold-cluster' }}
          secrets: |
            S3_ACCESS_KEY=secret/data/unfold-cluster/etcd-backup#ETCD_BACKUP_READ_ACCESS_KEY
            S3_SECRET_KEY=secret/data/unfold-cluster/etcd-backup#ETCD_BACKUP_READ_SECRET_KEY
            AGE_IDENTITY=secret/data/unfold-cluster/etcd-backup#ETCD_BACKUP_AGE_IDENTITY

      - name: Download the newest snapshot and refuse a stale one
        id: fetch
        run: |
          set -eu
          sign="aws:amz:${S3_REGION}:s3"
          newest="$(curl -fsS --aws-sigv4 "$sign" --user "${S3_ACCESS_KEY}:${S3_SECRET_KEY}" \
            "${S3_ENDPOINT}/${BUCKET}?list-type=2&prefix=${PREFIX}/" \
            | grep -o '<Key>[^<]*\.snap\.age</Key>' | sed 's/<[^>]*>//g' | sort | tail -n 1)"
          [ -n "$newest" ] || { echo "::error::no snapshot under ${BUCKET}/${PREFIX}/"; exit 1; }
          taken_at="$(printf '%s' "$newest" | sed -E 's/.*-([0-9]{4}-[0-9]{2}-[0-9]{2}T[^.]+)\.snap\.age$/\1/')"
          age_hours=$(( ( $(date -u +%s) - $(date -u -d "$taken_at" +%s) ) / 3600 ))
          echo "newest snapshot ${newest}, taken ${taken_at}, ${age_hours}h ago"
          [ "$age_hours" -le "$MAX_AGE_HOURS" ] || { echo "::error::the newest snapshot is ${age_hours}h old; backups have stopped"; exit 1; }
          curl -fsS --aws-sigv4 "$sign" --user "${S3_ACCESS_KEY}:${S3_SECRET_KEY}" \
            -o "${RUNNER_TEMP}/snapshot.snap.age" "${S3_ENDPOINT}/${BUCKET}/${newest}"

      - name: Restore it into a throwaway etcd and read the cluster back
        env:
          CORRUPT_ON_PURPOSE: ${{ inputs.corrupt == 'corrupt' }}
        run: |
          set -eu
          umask 077
          printf '%s\n' "${AGE_IDENTITY}" > "${RUNNER_TEMP}/age-identity.txt"
          AGE_IDENTITY_FILE="${RUNNER_TEMP}/age-identity.txt" ./scripts/verify-etcd-snapshot.sh "${RUNNER_TEMP}/snapshot.snap.age"

      - name: Remove the restore key and snapshot from the runner
        if: always()
        run: rm -f "${RUNNER_TEMP}/age-identity.txt" "${RUNNER_TEMP}/snapshot.snap.age"
