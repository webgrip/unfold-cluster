---
name: infra

on:
  push:
    branches:
      - main
    paths:
      - infra/**
      - .forgejo/workflows/infra.yml
      - talos/**
      - scripts/robot.sh
      - kubernetes/clusters/main/**
      - kubernetes/platform/cilium/**
      - kubernetes/platform/hcloud-cloud-controller-manager/**
      - kubernetes/platform/hetzner-charts/**
      - kubernetes/platform/flux-operator/**
      - kubernetes/platform/flux-instance/**
      - kubernetes/platform/coredns/**
      - kubernetes/platform/etcd-backup/namespace.yaml
      - scripts/write-cluster-secrets.sh
      - scripts/encrypt-node.sh
      - scripts/disk-kms-key.sh
      - scripts/guard-encryption-rollout.sh
      - scripts/openbao-kv.sh
      - scripts/lift-headscale-protection.sh
      - scripts/set-etcd-backup-lifecycle.sh
      - scripts/plan-digest.sh
      - scripts/tofu-plan.sh
  workflow_dispatch:
    inputs:
      apply:
        description: Choose "apply" to create or change the Hetzner resources in the plan this run makes, or "diagnose" to print the cluster's health without planning or changing anything
        required: true
        type: choice
        options:
          - plan-only
          - apply
          - diagnose
        default: plan-only
      plan_digest:
        description: The plan digest of the run you reviewed; apply refuses unless this run's plan has the same digest
        required: false
        type: string
        default: ""

concurrency:
  group: infra-state
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  plan-or-apply:
    # Never for pull requests. The credentials are not Forgejo secrets: OpenBao hands them only
    # to a job whose OIDC token says this repository, refs/heads/main, and push, schedule or
    # workflow_dispatch (role ci-unfold-cluster), so a branch's own workflow cannot read them.
    # Host mode: the steps run in the unfold-infra pool's toolchain image, the same infra-runner.
    if: github.event_name != 'pull_request' && inputs.apply != 'diagnose'
    runs-on: unfold-infra
    enable-openid-connect: true
    defaults:
      run:
        working-directory: infra
    env:
      TF_VAR_admin_cidrs: ${{ vars.ADMIN_CIDRS }}
      TF_VAR_admin_ssh_public_key: ${{ vars.ADMIN_SSH_PUBLIC_KEY }}
      TF_VAR_etcd_backup_age_recipient: ${{ vars.ETCD_BACKUP_AGE_RECIPIENT }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read the state, Hetzner and backup credentials from OpenBao
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/openbao-read@fec5377edfef94b7836bb115c732dfee6421e010 # v2.8.3
        with:
          role: ci-unfold-cluster
          secrets: |
            HCLOUD_TOKEN=secret/data/hetzner/unfold-tofu#HCLOUD_TOKEN
            AWS_ACCESS_KEY_ID=secret/data/unfold-cluster/tofu-state#STATE_S3_ACCESS_KEY
            AWS_SECRET_ACCESS_KEY=secret/data/unfold-cluster/tofu-state#STATE_S3_SECRET_KEY
            TF_VAR_state_passphrase=secret/data/unfold-cluster/tofu-state#STATE_PASSPHRASE
            TF_VAR_headscale_oidc_client_secret=secret/data/authentik/unfold-headscale-oidc#client_secret
            TF_VAR_hcloud_cluster_token=secret/data/hetzner/unfold-cluster#HCLOUD_TOKEN_CLUSTER
            TF_VAR_hcloud_vip_token=secret/data/hetzner/unfold-vip#HCLOUD_TOKEN_VIP
            TF_VAR_hcloud_autoscaler_token=secret/data/hetzner/unfold-autoscaler#HCLOUD_TOKEN_AUTOSCALER
            TF_VAR_etcd_backup_s3_access_key=secret/data/unfold-cluster/etcd-backup#ETCD_BACKUP_WRITE_ACCESS_KEY
            TF_VAR_etcd_backup_s3_secret_key=secret/data/unfold-cluster/etcd-backup#ETCD_BACKUP_WRITE_SECRET_KEY
            ROBOT_USER=secret/data/hetzner/unfold-robot#ROBOT_USER
            ROBOT_PASSWORD=secret/data/hetzner/unfold-robot#ROBOT_PASSWORD
            TF_VAR_metal_image_pull_username=secret/data/unfold-cluster/metal-image-pull#username
            TF_VAR_metal_image_pull_token=secret/data/unfold-cluster/metal-image-pull#token

      - name: Mask every prefix of the Hetzner tokens, which Hetzner's API errors quote
        working-directory: .
        run: ./scripts/mask-hcloud-token-prefixes.sh

      - name: Refuse to run without credentials
        run: |
          set -eu
          for name in HCLOUD_TOKEN AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY TF_VAR_admin_cidrs TF_VAR_state_passphrase TF_VAR_admin_ssh_public_key ROBOT_USER ROBOT_PASSWORD; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || { echo "::error::$name is not set for this repository"; exit 1; }
          done

      - name: Refuse to run without the Headscale OIDC client secret
        run: |
          set -eu
          [ -n "${TF_VAR_headscale_oidc_client_secret:-}" ] || { echo "::error::OpenBao secret/authentik/unfold-headscale-oidc has no client_secret; the homelab generates it (docs/runbooks/headscale-browser-login.md)"; exit 1; }

      - name: Format
        run: tofu fmt -check -recursive

      - name: Init
        env:
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
          STATE_REGION: ${{ vars.STATE_REGION }}
          STATE_ENDPOINT: ${{ vars.STATE_ENDPOINT }}
        run: |
          set -eu
          tofu init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="region=${STATE_REGION}" \
            -backend-config="endpoints={s3=\"${STATE_ENDPOINT}\"}"

      - name: Validate
        run: tofu validate

      - name: Bring the escrowed Talos secrets back when the state holds none
        run: |
          set -eu
          if tofu state list talos_machine_secrets.cluster | grep -q .; then
            echo "the state holds the cluster's Talos secrets"
            exit 0
          fi
          bundle="${RUNNER_TEMP}/talos-secrets.yaml"
          ( umask 077; ../scripts/openbao-kv.sh get unfold-cluster/talos-secrets bundle > "$bundle" )
          if [ -s "$bundle" ]; then
            echo "the state holds no Talos secrets; importing the bundle escrowed in OpenBao, so the cluster keeps its identity"
            echo "TF_VAR_talos_secrets_import_file=${bundle}" >> "${GITHUB_ENV}"
          else
            echo "no Talos secrets in the state or in OpenBao: this apply creates a new cluster identity"
          fi

      - name: Build the Talos snapshot when it does not exist yet, on apply runs only
        if: >-
          github.event_name == 'workflow_dispatch'
          && github.ref == 'refs/heads/main'
          && inputs.apply == 'apply'
        working-directory: .
        run: ./scripts/build-talos-snapshot.sh

      - name: Plan
        env:
          TF_VAR_talos_snapshot_required: >-
            ${{ github.event_name == 'workflow_dispatch'
            && github.ref == 'refs/heads/main'
            && inputs.apply == 'apply' }}
          UNFOLD_TAILNET_MINT: >-
            ${{ github.event_name == 'workflow_dispatch'
            && github.ref == 'refs/heads/main'
            && inputs.apply == 'apply'
            && 'allowed' || 'read-only' }}
        run: ../scripts/tofu-plan.sh -lock-timeout=5m -out=infra.tfplan

      - name: Print the plan digest to quote when applying
        run: |
          set -eu
          tofu show -no-color infra.tfplan > "${RUNNER_TEMP}/infra.plan.txt"
          digest="$(../scripts/plan-digest.sh < "${RUNNER_TEMP}/infra.plan.txt")"
          echo "::notice::plan digest ${digest}"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "plan digest \`${digest}\`" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Refuse a plan that re-installs more than one running node for disk encryption
        run: tofu show -json infra.tfplan | ../scripts/guard-encryption-rollout.sh

      - name: Give the disk-encryption rollout talosctl, kubectl and the cluster's talosconfig
        if: >-
          github.event_name == 'workflow_dispatch'
          && github.ref == 'refs/heads/main'
          && inputs.apply == 'apply'
        run: |
          set -eu
          ../scripts/diagnose-cluster.sh --install-tools "${RUNNER_TEMP}/rollout-bin"
          echo "${RUNNER_TEMP}/rollout-bin" >> "${GITHUB_PATH}"
          talosconfig="${RUNNER_TEMP}/rollout-talosconfig"
          if ( umask 077; tofu output -raw talosconfig > "$talosconfig" 2>/dev/null ) && [ -s "$talosconfig" ]; then
            echo "TALOSCONFIG=${talosconfig}" >> "${GITHUB_ENV}"
          else
            rm -f "$talosconfig"
            echo "the state has no talosconfig yet: only nodes in maintenance mode can be configured, none re-installed"
          fi

      - name: Apply, only when asked for by hand on main with the reviewed digest
        if: >-
          github.event_name == 'workflow_dispatch'
          && github.ref == 'refs/heads/main'
          && inputs.apply == 'apply'
        env:
          PLAN_DIGEST: ${{ inputs.plan_digest }}
          UNFOLD_TAILNET_MINT: allowed
        run: |
          set -eu
          tofu show -no-color infra.tfplan > "${RUNNER_TEMP}/infra.plan.txt"
          digest="$(../scripts/plan-digest.sh < "${RUNNER_TEMP}/infra.plan.txt")"
          if [ -z "${PLAN_DIGEST}" ] || [ "${PLAN_DIGEST}" != "${digest}" ]; then
            echo "::error::the plan changed since it was reviewed; read this run's plan and dispatch again with its digest (${digest})"
            exit 1
          fi
          tofu show -json infra.tfplan | ../scripts/lift-headscale-protection.sh
          tofu apply -lock-timeout=5m infra.tfplan

      - name: Escrow the Talos secrets in OpenBao
        if: >-
          github.event_name == 'workflow_dispatch'
          && github.ref == 'refs/heads/main'
          && inputs.apply == 'apply'
        run: tofu output -raw talos_secrets_bundle | ../scripts/openbao-kv.sh put talos-secrets unfold-cluster/talos-secrets bundle

      - name: Hand the homelab gateway its tailnet key through OpenBao
        if: >-
          github.event_name == 'workflow_dispatch'
          && github.ref == 'refs/heads/main'
          && inputs.apply == 'apply'
        run: tofu output -raw homelab_gateway_tailnet_key | ../scripts/openbao-kv.sh put authkey unfold/tailnet-homelab-gateway authkey

      - name: Keep the etcd backup bucket's 30-day expiry rule
        if: >-
          github.event_name == 'workflow_dispatch'
          && github.ref == 'refs/heads/main'
          && inputs.apply == 'apply'
        working-directory: .
        env:
          S3_ENDPOINT: ${{ vars.STATE_ENDPOINT }}
          S3_REGION: ${{ vars.STATE_REGION }}
        run: |
          set -eu
          AWS_ACCESS_KEY_ID="${TF_VAR_etcd_backup_s3_access_key}" AWS_SECRET_ACCESS_KEY="${TF_VAR_etcd_backup_s3_secret_key}" \
            ./scripts/set-etcd-backup-lifecycle.sh

  diagnose:
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
      && inputs.apply == 'diagnose'
    runs-on: unfold-infra
    enable-openid-connect: true
    defaults:
      run:
        working-directory: infra
    env:
      TF_VAR_admin_cidrs: ${{ vars.ADMIN_CIDRS }}
      TF_VAR_admin_ssh_public_key: ${{ vars.ADMIN_SSH_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read the state and Hetzner credentials from OpenBao
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/openbao-read@fec5377edfef94b7836bb115c732dfee6421e010 # v2.8.3
        with:
          role: ci-unfold-cluster
          secrets: |
            HCLOUD_TOKEN=secret/data/hetzner/unfold-tofu#HCLOUD_TOKEN
            AWS_ACCESS_KEY_ID=secret/data/unfold-cluster/tofu-state#STATE_S3_ACCESS_KEY
            AWS_SECRET_ACCESS_KEY=secret/data/unfold-cluster/tofu-state#STATE_S3_SECRET_KEY
            TF_VAR_state_passphrase=secret/data/unfold-cluster/tofu-state#STATE_PASSPHRASE
            ROBOT_USER=secret/data/hetzner/unfold-robot#ROBOT_USER
            ROBOT_PASSWORD=secret/data/hetzner/unfold-robot#ROBOT_PASSWORD

      - name: Mask every prefix of the Hetzner tokens, which Hetzner's API errors quote
        working-directory: .
        run: ./scripts/mask-hcloud-token-prefixes.sh

      - name: Init
        env:
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
          STATE_REGION: ${{ vars.STATE_REGION }}
          STATE_ENDPOINT: ${{ vars.STATE_ENDPOINT }}
        run: |
          set -eu
          tofu init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="region=${STATE_REGION}" \
            -backend-config="endpoints={s3=\"${STATE_ENDPOINT}\"}"

      - name: Report the cluster's health
        working-directory: .
        run: ./scripts/diagnose-cluster.sh
