---
name: infra

on:
  push:
    branches:
      - main
    paths:
      - infra/**
      - .forgejo/workflows/infra.yml
      - kubernetes/clusters/main/**
      - kubernetes/platform/cilium/**
      - kubernetes/platform/hcloud-cloud-controller-manager/**
      - kubernetes/platform/hetzner-charts/**
      - kubernetes/platform/flux-operator/**
      - kubernetes/platform/flux-instance/**
      - kubernetes/platform/etcd-backup/namespace.yaml
      - scripts/write-cluster-secrets.sh
  workflow_dispatch:
    inputs:
      apply:
        description: Choose "apply" to create or change the Hetzner resources in the plan this run makes, or "diagnose" to print the cluster's health without planning or changing anything
        required: true
        type: choice
        options:
          - plan-only
          - apply
          - diagnose
        default: plan-only
      plan_digest:
        description: The plan digest of the run you reviewed; apply refuses unless this run's plan has the same digest
        required: false
        type: string
        default: ""

concurrency:
  group: infra-state
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  plan-or-apply:
    # Never for pull requests. The credentials are not Forgejo secrets: OpenBao hands them only
    # to a job whose OIDC token says this repository, refs/heads/main, and push, schedule or
    # workflow_dispatch (role ci-unfold-cluster), so a branch's own workflow cannot read them.
    # Host mode: the steps run in the unfold-infra pool's toolchain image, the same infra-runner.
    if: github.event_name != 'pull_request' && inputs.apply != 'diagnose'
    runs-on: unfold-infra
    enable-openid-connect: true
    defaults:
      run:
        working-directory: infra
    env:
      TF_VAR_admin_cidrs: ${{ vars.ADMIN_CIDRS }}
      TF_VAR_admin_ssh_public_key: ${{ vars.ADMIN_SSH_PUBLIC_KEY }}
      TF_VAR_etcd_backup_age_recipient: ${{ vars.ETCD_BACKUP_AGE_RECIPIENT }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read the state, Hetzner and backup credentials from OpenBao
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/openbao-read@fec5377edfef94b7836bb115c732dfee6421e010 # v2.8.3
        with:
          role: ci-unfold-cluster
          secrets: |
            HCLOUD_TOKEN=secret/data/hetzner/unfold-tofu#HCLOUD_TOKEN
            AWS_ACCESS_KEY_ID=secret/data/unfold-cluster/tofu-state#STATE_S3_ACCESS_KEY
            AWS_SECRET_ACCESS_KEY=secret/data/unfold-cluster/tofu-state#STATE_S3_SECRET_KEY
            TF_VAR_state_passphrase=secret/data/unfold-cluster/tofu-state#STATE_PASSPHRASE
            TF_VAR_hcloud_cluster_token=secret/data/hetzner/unfold-cluster#HCLOUD_TOKEN_CLUSTER
            TF_VAR_hcloud_vip_token=secret/data/hetzner/unfold-vip#HCLOUD_TOKEN_VIP
            TF_VAR_etcd_backup_s3_access_key=secret/data/unfold-cluster/etcd-backup#ETCD_BACKUP_WRITE_ACCESS_KEY
            TF_VAR_etcd_backup_s3_secret_key=secret/data/unfold-cluster/etcd-backup#ETCD_BACKUP_WRITE_SECRET_KEY

      - name: Mask every prefix of the Hetzner tokens, which Hetzner's API errors quote
        working-directory: .
        run: ./scripts/mask-hcloud-token-prefixes.sh

      - name: Refuse to run without credentials
        run: |
          set -eu
          for name in HCLOUD_TOKEN AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY TF_VAR_admin_cidrs TF_VAR_state_passphrase TF_VAR_admin_ssh_public_key; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || { echo "::error::$name is not set for this repository"; exit 1; }
          done

      - name: Format
        run: tofu fmt -check -recursive

      - name: Init
        env:
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
          STATE_REGION: ${{ vars.STATE_REGION }}
          STATE_ENDPOINT: ${{ vars.STATE_ENDPOINT }}
        run: |
          set -eu
          tofu init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="region=${STATE_REGION}" \
            -backend-config="endpoints={s3=\"${STATE_ENDPOINT}\"}"

      - name: Validate
        run: tofu validate

      - name: Build the Talos snapshot when it does not exist yet, on apply runs only
        if: >-
          github.event_name == 'workflow_dispatch'
          && github.ref == 'refs/heads/main'
          && inputs.apply == 'apply'
        working-directory: .
        run: ./scripts/build-talos-snapshot.sh

      - name: Plan
        env:
          TF_VAR_talos_snapshot_required: >-
            ${{ github.event_name == 'workflow_dispatch'
            && github.ref == 'refs/heads/main'
            && inputs.apply == 'apply' }}
          UNFOLD_TAILNET_MINT: >-
            ${{ github.event_name == 'workflow_dispatch'
            && github.ref == 'refs/heads/main'
            && inputs.apply == 'apply'
            && 'allowed' || 'read-only' }}
        run: tofu plan -lock-timeout=5m -out=infra.tfplan

      - name: Print the plan digest to quote when applying
        run: |
          set -eu
          tofu show -no-color infra.tfplan > "${RUNNER_TEMP}/infra.plan.txt"
          digest="$(sha256sum "${RUNNER_TEMP}/infra.plan.txt" | cut -d' ' -f1)"
          echo "::notice::plan digest ${digest}"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "plan digest \`${digest}\`" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Apply, only when asked for by hand on main with the reviewed digest
        if: >-
          github.event_name == 'workflow_dispatch'
          && github.ref == 'refs/heads/main'
          && inputs.apply == 'apply'
        env:
          PLAN_DIGEST: ${{ inputs.plan_digest }}
          UNFOLD_TAILNET_MINT: allowed
        run: |
          set -eu
          tofu show -no-color infra.tfplan > "${RUNNER_TEMP}/infra.plan.txt"
          digest="$(sha256sum "${RUNNER_TEMP}/infra.plan.txt" | cut -d' ' -f1)"
          if [ -z "${PLAN_DIGEST}" ] || [ "${PLAN_DIGEST}" != "${digest}" ]; then
            echo "::error::the plan changed since it was reviewed; read this run's plan and dispatch again with its digest (${digest})"
            exit 1
          fi
          tofu apply -lock-timeout=5m infra.tfplan

  diagnose:
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
      && inputs.apply == 'diagnose'
    runs-on: unfold-infra
    enable-openid-connect: true
    defaults:
      run:
        working-directory: infra
    env:
      TF_VAR_admin_cidrs: ${{ vars.ADMIN_CIDRS }}
      TF_VAR_admin_ssh_public_key: ${{ vars.ADMIN_SSH_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read the state and Hetzner credentials from OpenBao
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/openbao-read@fec5377edfef94b7836bb115c732dfee6421e010 # v2.8.3
        with:
          role: ci-unfold-cluster
          secrets: |
            HCLOUD_TOKEN=secret/data/hetzner/unfold-tofu#HCLOUD_TOKEN
            AWS_ACCESS_KEY_ID=secret/data/unfold-cluster/tofu-state#STATE_S3_ACCESS_KEY
            AWS_SECRET_ACCESS_KEY=secret/data/unfold-cluster/tofu-state#STATE_S3_SECRET_KEY
            TF_VAR_state_passphrase=secret/data/unfold-cluster/tofu-state#STATE_PASSPHRASE

      - name: Mask every prefix of the Hetzner tokens, which Hetzner's API errors quote
        working-directory: .
        run: ./scripts/mask-hcloud-token-prefixes.sh

      - name: Init
        env:
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
          STATE_REGION: ${{ vars.STATE_REGION }}
          STATE_ENDPOINT: ${{ vars.STATE_ENDPOINT }}
        run: |
          set -eu
          tofu init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="region=${STATE_REGION}" \
            -backend-config="endpoints={s3=\"${STATE_ENDPOINT}\"}"

      - name: Report the cluster's health
        working-directory: .
        run: ./scripts/diagnose-cluster.sh
