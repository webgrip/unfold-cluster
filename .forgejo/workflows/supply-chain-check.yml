---
name: supply-chain-check

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - kubernetes/platform/kyverno/policies/**
      - kubernetes/platform/trivy-operator/app/report-shipper/**
      - tests/image-signatures/**
      - tests/trivy-report-shipper/**
      - scripts/test-image-signatures.sh
      - scripts/test-trivy-report-shipper.sh
      - .forgejo/workflows/supply-chain-check.yml
  workflow_dispatch:

jobs:
  image-signatures:
    runs-on: unfold-check
    steps:
      - uses: https://forgejo.webgrip.dev/actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Admit signed webgrip images, refuse unsigned and wrongly signed ones, and prove each gate is what refuses
        run: ./scripts/test-image-signatures.sh --mutation-test

  trivy-report-shipper:
    runs-on: unfold-check
    steps:
      - uses: https://forgejo.webgrip.dev/actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Turn every kind of Trivy report into the record VictoriaLogs receives
        run: ./scripts/test-trivy-report-shipper.sh
