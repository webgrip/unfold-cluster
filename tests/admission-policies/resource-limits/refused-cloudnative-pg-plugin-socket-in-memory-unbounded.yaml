---
apiVersion: v1
kind: Pod
metadata:
  name: example-db-1
  namespace: tenant
  labels:
    cnpg.io/cluster: example-db
    cnpg.io/instanceName: example-db-1
    cnpg.io/podRole: instance
spec:
  hostname: example-db-1
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 26
    runAsGroup: 26
    fsGroup: 26
    seccompProfile:
      type: RuntimeDefault
  initContainers:
    - name: bootstrap-controller
      image: ghcr.io/cloudnative-pg/cloudnative-pg:1.30.1@sha256:923c267ec29636db3bee20f993d0ec4973fa22998e1adad37da79e4d32b5bc07
      command:
        - /manager
        - bootstrap
        - /controller/manager
      securityContext: &cloudnativePgContainer
        allowPrivilegeEscalation: false
        privileged: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL
      resources: &instanceResources
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
          ephemeral-storage: 2Gi
      volumeMounts:
        - name: scratch-data
          mountPath: /controller
    - name: plugin-barman-cloud
      image: ghcr.io/cloudnative-pg/plugin-barman-cloud-sidecar:v0.15.1@sha256:2287a793a804db751edd0d07d44cd549e357677e98a800eb12e2cf7c0d53f9b0
      restartPolicy: Always
      securityContext: *cloudnativePgContainer
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
          ephemeral-storage: 512Mi
      volumeMounts:
        - name: plugins
          mountPath: /plugins
        - name: scratch-data
          mountPath: /controller
        - name: pgdata
          mountPath: /var/lib/postgresql/data
        - name: pg-wal
          mountPath: /var/lib/postgresql/wal
  containers:
    - name: postgres
      image: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:0675340b02be838319b9b6f323c206693e519dcd62ec729d539be9f46bb7a2f9
      command:
        - /controller/manager
        - instance
        - run
      securityContext: *cloudnativePgContainer
      resources: *instanceResources
      ports:
        - name: postgresql
          containerPort: 5432
        - name: metrics
          containerPort: 9187
        - name: status
          containerPort: 8000
      volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
        - name: pg-wal
          mountPath: /var/lib/postgresql/wal
        - name: scratch-data
          mountPath: /controller
        - name: shm
          mountPath: /dev/shm
        - name: plugins
          mountPath: /plugins
  volumes:
    - name: pgdata
      persistentVolumeClaim:
        claimName: example-db-1
    - name: scratch-data
      emptyDir:
        sizeLimit: 1Gi
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 256Mi
    - name: pg-wal
      persistentVolumeClaim:
        claimName: example-db-1-wal
    - name: plugins
      emptyDir:
        medium: Memory
