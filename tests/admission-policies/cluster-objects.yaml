---
apiVersion: v1
kind: Namespace
metadata:
  name: tenant
---
apiVersion: v1
kind: Namespace
metadata:
  name: ci
  labels:
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: zot
---
apiVersion: v1
kind: Namespace
metadata:
  name: flux-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: agent-hardened
  labels:
    ploeg.webgrip.dev/isolation-class: hardened
---
apiVersion: v1
kind: Namespace
metadata:
  name: agent-isolated
  labels:
    ploeg.webgrip.dev/isolation-class: isolated
---
apiVersion: v1
kind: Namespace
metadata:
  name: sandbox-probes
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata
handler: kata
---
apiVersion: v1
kind: Namespace
metadata:
  name: trivy-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: cluster-autoscaler
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: ci-runner
value: -5
preemptionPolicy: Never
---
apiVersion: v1
kind: Namespace
metadata:
  name: ops-gateway
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: ops-auth
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: headlamp
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: policy-reporter
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: predates-the-policies
  namespace: tenant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: predates-the-policies
  template:
    metadata:
      labels:
        app: predates-the-policies
    spec:
      hostNetwork: true
      containers:
        - name: app
          image: ghcr.io/siderolabs/talos-backup:v0.1.0-beta.3
