---
apiVersion: v1
kind: Pod
metadata:
  name: vector-abcde
  namespace: observability
  ownerReferences:
    - apiVersion: apps/v1
      kind: DaemonSet
      name: vector
      uid: 00000000-0000-0000-0000-000000000001
      controller: true
spec:
  automountServiceAccountToken: false
  hostNetwork: true
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: vector
      image: docker.io/timberio/vector:0.60.0-distroless-libc@sha256:a9ed9a4710bdc2efa66e94c1e8edc7b439709e6e50079f1e1b2b1bf479d387da
      ports:
        - name: metrics
          containerPort: 9598
          hostPort: 9598
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
        runAsUser: 0
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
          ephemeral-storage: 64Mi
      volumeMounts:
        - name: data
          mountPath: /var/lib/vector
        - name: var-log
          mountPath: /var/log
          readOnly: true
  volumes:
    - name: data
      hostPath:
        path: /var/lib/vector
        type: DirectoryOrCreate
    - name: var-log
      hostPath:
        path: /var/log
