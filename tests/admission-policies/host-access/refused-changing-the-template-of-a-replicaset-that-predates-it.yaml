---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: predates-the-policies
  namespace: tenant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: predates-the-policies
  template:
    metadata:
      labels:
        app: predates-the-policies
    spec:
      hostNetwork: true
      containers:
        - name: app
          image: ghcr.io/siderolabs/talos-backup:v0.1.0-beta.3
          env:
            - name: CHANGED
              value: "true"
