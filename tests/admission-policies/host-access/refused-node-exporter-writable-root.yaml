---
apiVersion: v1
kind: Pod
metadata:
  name: node-exporter-abcde
  namespace: observability
  ownerReferences:
    - apiVersion: apps/v1
      kind: DaemonSet
      name: node-exporter
      uid: 00000000-0000-0000-0000-000000000001
      controller: true
spec:
  automountServiceAccountToken: false
  hostNetwork: true
  hostPID: true
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: node-exporter
      image: quay.io/prometheus/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
      ports:
        - name: metrics
          containerPort: 9100
          hostPort: 9100
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
          ephemeral-storage: 64Mi
      volumeMounts:
        - name: proc
          mountPath: /host/proc
          readOnly: true
        - name: sys
          mountPath: /host/sys
          readOnly: true
        - name: root
          mountPath: /host/root
          readOnly: false
  volumes:
    - name: proc
      hostPath:
        path: /proc
    - name: sys
      hostPath:
        path: /sys
    - name: root
      hostPath:
        path: /
