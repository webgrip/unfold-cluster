---
apiVersion: v1
kind: Pod
metadata:
  name: alloy-logs-abcde
  namespace: observability
  ownerReferences:
    - apiVersion: apps/v1
      kind: DaemonSet
      name: alloy-logs
      uid: 00000000-0000-0000-0000-000000000001
      controller: true
spec:
  automountServiceAccountToken: false
  hostNetwork: true
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: alloy-logs
      image: docker.io/grafana/alloy:v1.21.2@sha256:89a5a320168387336b9ac3c850609c3ba7757eadd4ae5f1d819deb35e9854b18
      ports:
        - name: metrics
          containerPort: 9598
          hostPort: 9598
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
        runAsUser: 0
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
          ephemeral-storage: 64Mi
      volumeMounts:
        - name: data
          mountPath: /var/lib/alloy
        - name: var-log
          mountPath: /var/log
          readOnly: true
        - name: etc
          mountPath: /host/etc
          readOnly: true
  volumes:
    - name: data
      hostPath:
        path: /var/lib/alloy
        type: DirectoryOrCreate
    - name: var-log
      hostPath:
        path: /var/log
    - name: etc
      hostPath:
        path: /etc
