        httpGet:
          path: /-/healthy
          port: http
        periodSeconds: 30
      name: alertmanager
      ports:
        - containerPort: 9093
          name: http
      readinessProbe:
        httpGet:
          path: /-/ready
          port: http
        periodSeconds: 15
      resources:
        limits:
          ephemeral-storage: 64Mi
          memory: 128Mi
        requests:
          cpu: 10m
          memory: 48Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      volumeMounts:
        - mountPath: /etc/alertmanager/config
          name: config
          readOnly: true
        - mountPath: /etc/alertmanager/ntfy
          name: ntfy
          readOnly: true
        - mountPath: /etc/alertmanager/deadman
