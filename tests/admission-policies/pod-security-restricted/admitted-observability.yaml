          readOnly: true
        - mountPath: /alertmanager
          name: data
  securityContext:
    fsGroup: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/control-plane
      operator: Exists
    - effect: NoSchedule
      key: node.webgrip.io/pool
      operator: Equal
      value: system
  volumes:
    - configMap:
        name: alertmanager-dhff6848ft
      name: config
    - name: ntfy
      secret:
        optional: true
        secretName: alertmanager-ntfy
    - name: deadman
