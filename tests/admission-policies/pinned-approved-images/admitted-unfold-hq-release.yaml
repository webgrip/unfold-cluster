---
apiVersion: v1
kind: Pod
metadata:
  name: unfold-hq-release
  namespace: tenant
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: unfold
      image: ghcr.io/unfold-hq/unfold@sha256:e2fe8a711b78ee5a57bd200765931e129b4894d8d75e165cb34f5e2036285d9b
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
          ephemeral-storage: 64Mi
      volumeMounts:
        - name: tmp
          mountPath: /tmp
    - name: workspace
      image: ghcr.io/unfold-hq/unfold-agent:0.4.0-rc.132@sha256:7c8bb8f4028a0648b8c8805546736939044aa8a1a484b760c29c6fedb4a88b24
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
          ephemeral-storage: 64Mi
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir:
        sizeLimit: 64Mi
