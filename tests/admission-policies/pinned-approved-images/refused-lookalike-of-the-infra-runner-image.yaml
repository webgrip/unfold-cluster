---
apiVersion: v1
kind: Pod
metadata:
  name: forgejo-check-runner-lookalike
  namespace: ci
  labels:
    app.kubernetes.io/name: forgejo-runner
    app.kubernetes.io/component: check
    app.kubernetes.io/part-of: unfold-ci
  annotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: 'false'
spec:
  restartPolicy: Never
  runtimeClassName: gvisor
  serviceAccountName: forgejo-runner
  automountServiceAccountToken: false
  enableServiceLinks: false
  terminationGracePeriodSeconds: 30
  priorityClassName: ci-runner
  tolerations:
  - key: node.webgrip.io/pool
    operator: Equal
    value: unfold
    effect: NoSchedule
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
          - key: node.webgrip.io/pool
            operator: In
            values:
            - unfold
      - weight: 50
        preference:
          matchExpressions:
          - key: node.webgrip.io/pool
            operator: In
            values:
            - ci
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  initContainers:
  - name: register
    image: code.forgejo.org/forgejo/runner:12.13.2@sha256:eb6e7bc21973382d261e6eb883dbd27b8cb56939d33a3bfd79a1352b7f9a33a0
    command:
    - sh
    - -ec
    args:
    - "cp \"$(command -v forgejo-runner)\" /opt/ci/bin/forgejo-runner\nchmod 0755\
      \ /opt/ci/bin/forgejo-runner\nforgejo-runner --config /etc/forgejo-runner/config.yaml\
      \ register \\\n  --no-interactive \\\n  --ephemeral \\\n  --instance \"$FORGEJO_URL\"\
      \ \\\n  --name \"unfold-check-$POD_NAME\" \\\n  --token \"$(cat /run/forgejo-runner/registration/token)\"\
      \n"
    env:
    - name: FORGEJO_URL
      value: https://forgejo.webgrip.dev
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
        ephemeral-storage: 512Mi
    volumeMounts:
    - name: tools
      mountPath: /opt/ci/bin
    - name: runner-config
      mountPath: /etc/forgejo-runner
      readOnly: true
    - name: registration
      mountPath: /run/forgejo-runner/registration
      readOnly: true
    - name: runner-state
      mountPath: /run/forgejo-runner/state
  containers:
  - name: runner
    image: forgejo.webgrip.dev/webgrip/infra-runner-evil:0.2.0@sha256:c0703b8eb5a037ab3d0d2260a3c2aa13e09de4c4007da04504d6e01801a7fee7
    command:
    - sh
    - -ec
    args:
    - 'mkdir -p "$HOME" "$TMPDIR" /work/act

      exec forgejo-runner --config /etc/forgejo-runner/config.yaml one-job --wait

      '
    env:
    - name: HOME
      value: /work/home
    - name: TMPDIR
      value: /work/tmp
    - name: PATH
      value: /opt/ci/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    workingDir: /work
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: Localhost
        localhostProfile: profiles/ci-runner.json
    readinessProbe:
      exec:
        command:
        - sh
        - -c
        - test -n "$(ls -A /work/act 2>/dev/null)"
      periodSeconds: 5
      timeoutSeconds: 3
    resources:
      requests:
        cpu: '1'
        memory: 2Gi
        ephemeral-storage: 5Gi
      limits:
        memory: 4Gi
        ephemeral-storage: 20Gi
    volumeMounts:
    - name: tools
      mountPath: /opt/ci/bin
      readOnly: true
    - name: runner-config
      mountPath: /etc/forgejo-runner
      readOnly: true
    - name: runner-state
      mountPath: /run/forgejo-runner/state
    - name: work
      mountPath: /work
  volumes:
  - name: tools
    emptyDir:
      sizeLimit: 256Mi
  - name: runner-state
    emptyDir:
      sizeLimit: 1Mi
  - name: work
    emptyDir:
      sizeLimit: 20Gi
  - name: runner-config
    configMap:
      name: forgejo-check-runner-config
  - name: registration
    secret:
      secretName: forgejo-runner-registration
      defaultMode: 288
