---
apiVersion: v1
kind: Pod
metadata:
  name: authentik-relay
  namespace: ops-auth
  labels:
    app.kubernetes.io/name: authentik-relay
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: node.webgrip.io/pool
            operator: In
            values:
            - unfold
  automountServiceAccountToken: false
  containers:
  - args:
    - -c
    - /etc/envoy/authentik-relay.yaml
    - --log-level
    - warn
    - --disable-hot-restart
    image: docker.io/envoyproxy/envoy:distroless-v1.40.1@sha256:6cf314259a0adde2386baafeeeb041ed37a30f6bdd935cff36cd38a1e15acab1
    name: envoy
    ports:
    - containerPort: 3128
      name: connect
    readinessProbe:
      periodSeconds: 10
      tcpSocket:
        port: connect
    resources:
      limits:
        ephemeral-storage: 16Mi
        memory: 64Mi
      requests:
        cpu: 5m
        memory: 24Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
    volumeMounts:
    - mountPath: /etc/envoy
      name: config
      readOnly: true
  enableServiceLinks: false
  securityContext:
    runAsGroup: 65532
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  serviceAccountName: authentik-relay
  tolerations:
  - effect: NoSchedule
    key: node.webgrip.io/pool
    operator: Equal
    value: unfold
  volumes:
  - configMap:
      name: authentik-relay-cm65h425gt
    name: config

---
apiVersion: v1
kind: Pod
metadata:
  name: oauth2-proxy-hubble
  namespace: ops-auth
  labels:
    app.kubernetes.io/component: oauth2-proxy
    app.kubernetes.io/name: oauth2-proxy-hubble
spec:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - preference:
          matchExpressions:
          - key: node.webgrip.io/pool
            operator: In
            values:
            - system
        weight: 100
      - preference:
          matchExpressions:
          - key: node.webgrip.io/pool
            operator: In
            values:
            - unfold
        weight: 50
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: node.webgrip.io/pool
            operator: In
            values:
            - system
            - unfold
        - matchExpressions:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
  automountServiceAccountToken: false
  containers:
  - args:
    - --http-address=0.0.0.0:4180
    - --reverse-proxy=true
    - --provider=oidc
    - --provider-display-name=Authentik
    - --oidc-issuer-url=https://authentik.webgrip.dev/application/o/unfold-consoles/
    - --client-id=unfold-consoles
    - --client-secret-file=/etc/oauth2-proxy/oidc/client_secret
    - --code-challenge-method=S256
    - --scope=openid profile offline_access unfold_kubernetes
    - --oidc-email-claim=preferred_username
    - --oidc-groups-claim=unfold_groups
    - --allowed-group=unfold-admins
    - --allowed-group=unfold-viewers
    - --email-domain=*
    - --redirect-url=https://hubble.ops.unfoldhq.dev/oauth2/callback
    - --upstream=http://hubble-ui.kube-system.svc.cluster.local:80
    - --cookie-name=__Host-ops-hubble
    - --cookie-secret-file=/etc/oauth2-proxy/cookie/cookie_secret
    - --cookie-secure=true
    - --cookie-samesite=lax
    - --cookie-expire=12h
    - --cookie-refresh=10m
    - --skip-provider-button=true
    - --silence-ping-logging=true
    - --pass-access-token=false
    - --pass-authorization-header=false
    env:
    - name: HTTPS_PROXY
      value: http://authentik-relay.ops-auth.svc.cluster.local:3128
    - name: NO_PROXY
      value: .cluster.local,.svc,10.65.0.0/16,10.66.0.0/16
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
    livenessProbe:
      httpGet:
        path: /ping
        port: http
      periodSeconds: 30
    name: oauth2-proxy
    ports:
    - containerPort: 4180
      name: http
    readinessProbe:
      httpGet:
        path: /ping
        port: http
      periodSeconds: 10
    resources:
      limits:
        ephemeral-storage: 16Mi
        memory: 64Mi
      requests:
        cpu: 5m
        memory: 24Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
    volumeMounts:
    - mountPath: /etc/oauth2-proxy/oidc
      name: oidc
      readOnly: true
    - mountPath: /etc/oauth2-proxy/cookie
      name: cookie
      readOnly: true
  enableServiceLinks: false
  securityContext:
    runAsGroup: 65532
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  serviceAccountName: oauth2-proxy-hubble
  tolerations:
  - effect: NoSchedule
    key: node.webgrip.io/pool
    operator: Equal
    value: system
  - effect: NoSchedule
    key: node.webgrip.io/pool
    operator: Equal
    value: unfold
  - effect: NoSchedule
    key: node-role.kubernetes.io/control-plane
    operator: Exists
  volumes:
  - name: oidc
    secret:
      secretName: ops-consoles-oidc
  - name: cookie
    secret:
      secretName: oauth2-proxy-hubble-cookie

