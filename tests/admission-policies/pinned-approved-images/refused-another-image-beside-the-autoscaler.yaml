---
apiVersion: v1
kind: Pod
metadata:
  name: another-image-under-autoscaling
  namespace: cluster-autoscaler
  labels:
    app.kubernetes.io/name: hetzner-cluster-autoscaler
spec:
  priorityClassName: system-cluster-critical
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: hetzner-cluster-autoscaler
      image: registry.k8s.io/autoscaling/addon-resizer:1.8.23@sha256:461388d03eb5b55db58941ee7a81d9a619dd15302b01cbab9f5a9946715994b4
      command:
        - ./cluster-autoscaler
        - --cloud-provider=hetzner
        - --nodes=0:1:cpx42:nbg1:ci
      envFrom:
        - secretRef:
            name: cluster-autoscaler-hcloud
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 20m
          memory: 128Mi
        limits:
          memory: 512Mi
          ephemeral-storage: 256Mi
