---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tag-only
  namespace: tenant
spec:
  selector:
    matchLabels:
      app: tag-only
  template:
    metadata:
      labels:
        app: tag-only
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/siderolabs/talos-backup:v0.1.0-beta.3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
              ephemeral-storage: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
