---
tests:
  - name: a kubectl exec arrives as an exec outside the container's init tree
    inputs:
      - insert_at: tetragon_records
        type: log
        log_fields:
          message: '{"process_exec":{"process":{"exec_id":"dW5mb2xkLWFwcC0xOjE6MQ==","pid":4242,"uid":0,"cwd":"/","binary":"/bin/sh","arguments":"-c id","flags":"execve rootcwd clone","start_time":"2026-10-25T21:00:00Z","auid":4294967295,"parent_exec_id":"dW5mb2xkLWFwcC0xOjE6MA==","tid":4242,"in_init_tree":false,"pod":{"namespace":"zot","name":"zot-0","uid":"6c1f","container":{"id":"containerd://ab12","name":"zot","image":{"id":"ghcr.io/project-zot/zot@sha256:aa","name":"ghcr.io/project-zot/zot:v2.1.15"},"start_time":"2026-10-25T20:00:00Z","pid":1},"pod_labels":{"app.kubernetes.io/name":"zot"},"workload":"zot","workload_kind":"StatefulSet"}},"parent":{"exec_id":"dW5mb2xkLWFwcC0xOjE6MA==","pid":4200,"uid":0,"binary":"/usr/bin/runc","flags":"procFS","in_init_tree":false}},"node_name":"unfold-app-1","time":"2026-10-25T21:00:01.123456789Z","cluster_name":"unfold","node_labels":{"kubernetes.io/hostname":"unfold-app-1","node.webgrip.io/pool":"unfold"}}'
    outputs:
      - extract_from: tetragon_records
        conditions:
          - type: vrl
            source: |
              assert_eq!(.source, "tetragon")
              assert_eq!(.event, "process_exec")
              assert_eq!(.namespace, "zot")
              assert_eq!(.pod, "zot-0")
              assert_eq!(.container, "zot")
              assert_eq!(.workload, "zot")
              assert_eq!(.binary, "/bin/sh")
              assert_eq!(.in_init_tree, false)
              assert_eq!(.parent_binary, "/usr/bin/runc")
              assert_eq!(.node, "unfold-app-1")
              assert_eq!(.timestamp, "2026-10-25T21:00:01.123456789Z")
              assert_eq!(.message, "process_exec zot/zot-0 /bin/sh")
              assert!(!exists(.tetragon.node_labels))
              assert_eq!(.tetragon.cluster_name, "unfold")
  - name: a credential read names its policy, hook and path
    inputs:
      - insert_at: tetragon_records
        type: log
        log_fields:
          message: '{"process_kprobe":{"process":{"exec_id":"dW5mb2xkLWFwcC0xOjE6MQ==","pid":4242,"uid":0,"cwd":"/","binary":"/bin/cat","arguments":"/var/run/secrets/kubernetes.io/serviceaccount/token","flags":"execve rootcwd clone inInitTree","start_time":"2026-10-25T21:00:00Z","auid":4294967295,"parent_exec_id":"dW5mb2xkLWFwcC0xOjE6MA==","tid":4242,"in_init_tree":true,"pod":{"namespace":"zot","name":"zot-0","uid":"6c1f","container":{"id":"containerd://ab12","name":"zot","image":{"id":"ghcr.io/project-zot/zot@sha256:aa","name":"ghcr.io/project-zot/zot:v2.1.15"},"start_time":"2026-10-25T20:00:00Z","pid":1},"pod_labels":{"app.kubernetes.io/name":"zot"},"workload":"zot","workload_kind":"StatefulSet"}},"parent":{"exec_id":"dW5mb2xkLWFwcC0xOjE6MA==","pid":4200,"uid":0,"binary":"/usr/bin/runc","flags":"procFS","in_init_tree":false},"function_name":"security_file_open","args":[{"file_arg":{"path":"/var/run/secrets/kubernetes.io/serviceaccount/..2026_10_25_21_00_00.1/token","permission":"-rw-r-----"}}],"action":"KPROBE_ACTION_POST","policy_name":"runtime-kubernetes-credentials","return_action":"KPROBE_ACTION_POST","tags":["runtime-security","credential-access"]},"node_name":"unfold-app-1","time":"2026-10-25T21:00:01.123456789Z","cluster_name":"unfold","node_labels":{"kubernetes.io/hostname":"unfold-app-1","node.webgrip.io/pool":"unfold"}}'
    outputs:
      - extract_from: tetragon_records
        conditions:
          - type: vrl
            source: |
              assert_eq!(.event, "process_kprobe")
              assert_eq!(.policy, "runtime-kubernetes-credentials")
              assert_eq!(.function, "security_file_open")
              assert_eq!(.path, "/var/run/secrets/kubernetes.io/serviceaccount/..2026_10_25_21_00_00.1/token")
              assert_eq!(.binary, "/bin/cat")
              assert_eq!(.in_init_tree, true)
              assert_eq!(.action, "KPROBE_ACTION_POST")
              assert_eq!(.daddr, "")
  - name: a TCP connect carries its destination address and port
    inputs:
      - insert_at: tetragon_records
        type: log
        log_fields:
          message: '{"process_kprobe":{"process":{"exec_id":"dW5mb2xkLWFwcC0xOjE6MQ==","pid":4242,"uid":0,"cwd":"/","binary":"/usr/bin/nc","arguments":"-w 2 192.0.2.10 3333","flags":"execve rootcwd clone inInitTree","start_time":"2026-10-25T21:00:00Z","auid":4294967295,"parent_exec_id":"dW5mb2xkLWFwcC0xOjE6MA==","tid":4242,"in_init_tree":true,"pod":{"namespace":"zot","name":"zot-0","uid":"6c1f","container":{"id":"containerd://ab12","name":"zot","image":{"id":"ghcr.io/project-zot/zot@sha256:aa","name":"ghcr.io/project-zot/zot:v2.1.15"},"start_time":"2026-10-25T20:00:00Z","pid":1},"pod_labels":{"app.kubernetes.io/name":"zot"},"workload":"zot","workload_kind":"StatefulSet"}},"parent":{"exec_id":"dW5mb2xkLWFwcC0xOjE6MA==","pid":4200,"uid":0,"binary":"/usr/bin/runc","flags":"procFS","in_init_tree":false},"function_name":"tcp_connect","args":[{"sock_arg":{"family":"AF_INET","type":"SOCK_STREAM","protocol":"IPPROTO_TCP","saddr":"10.65.2.18","daddr":"192.0.2.10","sport":40312,"dport":3333,"cookie":"1844","state":"TCP_SYN_SENT"}}],"action":"KPROBE_ACTION_POST","policy_name":"runtime-outbound-connects","return_action":"KPROBE_ACTION_POST"},"node_name":"unfold-app-1","time":"2026-10-25T21:00:01.123456789Z","cluster_name":"unfold","node_labels":{"kubernetes.io/hostname":"unfold-app-1","node.webgrip.io/pool":"unfold"}}'
    outputs:
      - extract_from: tetragon_records
        conditions:
          - type: vrl
            source: |
              assert_eq!(.policy, "runtime-outbound-connects")
              assert_eq!(.daddr, "192.0.2.10")
              assert_eq!(.dport, "3333")
              assert_eq!(.path, "")
              assert_eq!(.message, "process_kprobe zot/zot-0 /usr/bin/nc runtime-outbound-connects 192.0.2.10:3333")
  - name: a module request from the host keeps its string argument and no pod
    inputs:
      - insert_at: tetragon_records
        type: log
        log_fields:
          message: '{"process_kprobe":{"process":{"exec_id":"dW5mb2xkLWFwcC0xOjE6MQ==","pid":4242,"uid":0,"cwd":"/","binary":"/usr/sbin/modprobe","arguments":"-q -- net-pf-38","flags":"execve rootcwd clone inInitTree","start_time":"2026-10-25T21:00:00Z","auid":4294967295,"parent_exec_id":"dW5mb2xkLWFwcC0xOjE6MA==","tid":4242,"in_init_tree":true},"function_name":"security_kernel_module_request","args":[{"string_arg":"net-pf-38"}],"action":"KPROBE_ACTION_POST","policy_name":"runtime-kernel-modules"},"node_name":"unfold-app-1","time":"2026-10-25T21:00:01.123456789Z","cluster_name":"unfold","node_labels":{"kubernetes.io/hostname":"unfold-app-1","node.webgrip.io/pool":"unfold"}}'
    outputs:
      - extract_from: tetragon_records
        conditions:
          - type: vrl
            source: |
              assert_eq!(.policy, "runtime-kernel-modules")
              assert_eq!(.string_args, "net-pf-38")
              assert_eq!(.namespace, "")
              assert_eq!(.pod, "")
              assert_eq!(.message, "process_kprobe host /usr/sbin/modprobe runtime-kernel-modules net-pf-38")
  - name: a host exec has no namespace
    inputs:
      - insert_at: tetragon_records
        type: log
        log_fields:
          message: '{"process_exec":{"process":{"exec_id":"dW5mb2xkLWFwcC0xOjE6MQ==","pid":4242,"uid":0,"cwd":"/","binary":"/usr/bin/containerd-shim-runc-v2","arguments":"-namespace k8s.io","flags":"execve rootcwd clone","start_time":"2026-10-25T21:00:00Z","auid":4294967295,"parent_exec_id":"dW5mb2xkLWFwcC0xOjE6MA==","tid":4242,"in_init_tree":false}},"node_name":"unfold-app-1","time":"2026-10-25T21:00:01.123456789Z","cluster_name":"unfold","node_labels":{"kubernetes.io/hostname":"unfold-app-1","node.webgrip.io/pool":"unfold"}}'
    outputs:
      - extract_from: tetragon_records
        conditions:
          - type: vrl
            source: |
              assert_eq!(.event, "process_exec")
              assert_eq!(.namespace, "")
              assert_eq!(.binary, "/usr/bin/containerd-shim-runc-v2")
              assert_eq!(.message, "process_exec host /usr/bin/containerd-shim-runc-v2")
  - name: a setuid exec reports the privilege change and the pod's isolation class
    inputs:
      - insert_at: tetragon_records
        type: log
        log_fields:
          message: '{"process_exec":{"process":{"exec_id":"dW5mb2xkLWFwcC0xOjE6MQ==","pid":4242,"uid":0,"cwd":"/","binary":"/usr/bin/sudo","arguments":"id","flags":"execve rootcwd clone inInitTree","start_time":"2026-10-25T21:00:00Z","auid":4294967295,"parent_exec_id":"dW5mb2xkLWFwcC0xOjE6MA==","tid":4242,"in_init_tree":true,"pod":{"namespace":"zot","name":"zot-0","uid":"6c1f","container":{"id":"containerd://ab12","name":"zot","image":{"id":"ghcr.io/project-zot/zot@sha256:aa","name":"ghcr.io/project-zot/zot:v2.1.15"},"start_time":"2026-10-25T20:00:00Z","pid":1},"pod_labels":{"ploeg.webgrip.dev/isolation-class":"hardened"},"workload":"zot","workload_kind":"StatefulSet"},"binary_properties":{"setuid":0,"privileges_changed":["PRIVILEGES_RAISED_EXEC_FILE_SETUID"]}}},"node_name":"unfold-app-1","time":"2026-10-25T21:00:01.123456789Z","cluster_name":"unfold","node_labels":{"kubernetes.io/hostname":"unfold-app-1","node.webgrip.io/pool":"unfold"}}'
    outputs:
      - extract_from: tetragon_records
        conditions:
          - type: vrl
            source: |
              assert_eq!(.privileges_changed, "PRIVILEGES_RAISED_EXEC_FILE_SETUID")
              assert_eq!(.isolation_class, "hardened")
  - name: a rate-limit notice keeps its node
    inputs:
      - insert_at: tetragon_records
        type: log
        log_fields:
          message: '{"rate_limit_info":{"number_of_dropped_process_events":"512"},"node_name":"unfold-cp-1","time":"2026-10-25T21:00:02Z"}'
    outputs:
      - extract_from: tetragon_records
        conditions:
          - type: vrl
            source: |
              assert_eq!(.event, "rate_limit_info")
              assert_eq!(.node, "unfold-cp-1")
              assert_eq!(.binary, "")
  - name: a line that is not JSON is dropped
    inputs:
      - insert_at: tetragon_records
        type: log
        log_fields:
          message: 'not json'
    no_outputs_from:
      - tetragon_records
