---
apiVersion: v1
kind: Config
clusters:
  - name: unfold-main
    cluster:
      server: https://10.64.0.10:6443
      certificate-authority-data: 
users:
  - name: oidc
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1
        interactiveMode: IfAvailable
        command: kubectl
        args:
          - oidc-login
          - get-token
          - --oidc-issuer-url=https://authentik.webgrip.dev/application/o/unfold-kubernetes/
          - --oidc-client-id=unfold-kubernetes
          - --oidc-pkce-method=S256
          - --oidc-extra-scope=profile
          - --oidc-extra-scope=offline_access
          - --oidc-extra-scope=unfold_kubernetes
contexts:
  - name: unfold-oidc
    context:
      cluster: unfold-main
      user: oidc
current-context: unfold-oidc
