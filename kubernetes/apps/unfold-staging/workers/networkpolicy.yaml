---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ploeg-worker
spec:
  description: Adds to the chart's worker NetworkPolicy the one destination it cannot express, Forgejo over HTTPS by name, for clone and push. Nothing reaches a worker pod. The chart's own policy allows DNS without a name filter, so this namespace's lookups are not narrowed yet.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: ploeg-worker
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "**.cluster.local"
              - matchName: forgejo.webgrip.dev
    - toFQDNs:
        - matchName: forgejo.webgrip.dev
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
