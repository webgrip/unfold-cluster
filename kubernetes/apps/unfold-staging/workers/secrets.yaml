---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-builder-token
  annotations:
    wellhead.dev/origin: "minted"
    wellhead.dev/docs: "https://forgejo.webgrip.dev/webgrip/unfold-cluster/src/branch/main/docs/runbooks/unfold-staging.md"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-homelab
  target:
    name: agent-builder-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: FORGEJO_TOKEN
      remoteRef:
        key: unfold-main/staging/forgejo
        property: builder-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-reader-token
  annotations:
    wellhead.dev/origin: "minted"
    wellhead.dev/docs: "https://forgejo.webgrip.dev/webgrip/unfold-cluster/src/branch/main/docs/runbooks/unfold-staging.md"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-homelab
  target:
    name: agent-reader-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: FORGEJO_TOKEN
      remoteRef:
        key: unfold-main/staging/forgejo
        property: reader-token
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ploeg-bootstrap-reader
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-ploeg-bootstrap-reader-token
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["ploeg-bootstrap-reader"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-ploeg-bootstrap-reader-token
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-secrets-ploeg-bootstrap-reader-token
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: unfold-staging
spec:
  provider:
    kubernetes:
      remoteNamespace: unfold-staging
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: ploeg-bootstrap-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ploeg-worker-bootstrap
  annotations:
    wellhead.dev/origin: "projected"
    wellhead.dev/docs: "https://forgejo.webgrip.dev/webgrip/unfold-cluster/src/branch/main/docs/runbooks/unfold-staging.md#turning-ploegs-executor-on"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: unfold-staging
  target:
    name: ploeg-worker-bootstrap
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        staging--builder: '{{ range (.registry | fromJson) }}{{ if eq .role "builder" }}{{ .token }}{{ end }}{{ end }}'
        staging--reviewer: '{{ range (.registry | fromJson) }}{{ if eq .role "reviewer" }}{{ .token }}{{ end }}{{ end }}'
  data:
    - secretKey: registry
      remoteRef:
        key: ploeg-worker-bootstrap
        property: registry.json
