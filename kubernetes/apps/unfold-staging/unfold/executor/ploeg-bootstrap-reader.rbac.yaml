---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ploeg-bootstrap-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ploeg-worker-bootstrap"]
    verbs: ["get"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ploeg-bootstrap-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ploeg-bootstrap-reader
subjects:
  - kind: ServiceAccount
    name: ploeg-bootstrap-reader
    namespace: unfold-staging-workers
