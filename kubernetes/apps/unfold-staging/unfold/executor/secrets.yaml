---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-litellm-master
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-homelab
  target:
    name: agent-litellm-master
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: unfold-main/staging/litellm
        property: master-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-builder-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-homelab
  target:
    name: agent-builder-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: FORGEJO_TOKEN
      remoteRef:
        key: unfold-main/staging/forgejo
        property: builder-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-reader-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-homelab
  target:
    name: agent-reader-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: FORGEJO_TOKEN
      remoteRef:
        key: unfold-main/staging/forgejo
        property: reader-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ploeg-forge-webhook
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-homelab
  target:
    name: ploeg-forge-webhook
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: PLOEG_FORGEJO_SECRET
      remoteRef:
        key: unfold-main/staging/forgejo
        property: webhook-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ploeg-worker-signing
spec:
  refreshInterval: "0"
  target:
    name: ploeg-worker-signing
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: token
      rewrite:
        - regexp:
            source: password
            target: key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ploeg-worker-bootstrap
spec:
  refreshInterval: "0"
  refreshPolicy: OnChange
  target:
    name: ploeg-worker-bootstrap
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        registry.json: >-
          [{"team":"staging","role":"builder","token":{{ .staging_builder | toJson }}},
          {"team":"staging","role":"reviewer","token":{{ .staging_reviewer | toJson }}}]
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: token
      rewrite:
        - regexp:
            source: password
            target: staging_builder
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: token
      rewrite:
        - regexp:
            source: password
            target: staging_reviewer
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ploeg-scaler
spec:
  refreshInterval: "0"
  target:
    name: ploeg-scaler
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: token
      rewrite:
        - regexp:
            source: password
            target: password
