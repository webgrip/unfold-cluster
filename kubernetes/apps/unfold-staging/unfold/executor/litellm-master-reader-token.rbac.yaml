---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-litellm-master-reader-token
rules:
  - apiGroups:
      - ""
    resources:
      - serviceaccounts/token
    resourceNames:
      - litellm-master-reader
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-litellm-master-reader-token
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-secrets-litellm-master-reader-token
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
