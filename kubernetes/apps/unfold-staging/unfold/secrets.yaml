---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: token
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unfold-credentials
spec:
  refreshInterval: "0"
  target:
    name: unfold-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: token
      rewrite:
        - regexp:
            source: password
            target: PLOEG_OPERATOR_UNFOLD_TOKEN
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: token
      rewrite:
        - regexp:
            source: password
            target: UNFOLD_ADMIN_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ploeg-vikunja-bot
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-homelab
  target:
    name: ploeg-vikunja-bot
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: VIKUNJA_API_TOKEN
      remoteRef:
        key: unfold-main/staging/vikunja
        property: api-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ploeg-webhook-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-homelab
  target:
    name: ploeg-webhook-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: PLOEG_VIKUNJA_SECRET
      remoteRef:
        key: unfold-main/staging/vikunja
        property: webhook-secret
