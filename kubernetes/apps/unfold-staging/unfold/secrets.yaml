---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: token
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unfold-credentials
  annotations:
    wellhead.dev/origin: "minted"
spec:
  refreshInterval: "0"
  target:
    name: unfold-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: token
      rewrite:
        - regexp:
            source: password
            target: PLOEG_OPERATOR_UNFOLD_TOKEN
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: token
      rewrite:
        - regexp:
            source: password
            target: UNFOLD_ADMIN_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ploeg-vikunja-bot
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "A Vikunja API token of the bot-ploeg user at vikunja.webgrip.dev (its Settings, API Tokens) with read and write on projects and tasks, shared with the Ploeg Staging project only."
    wellhead.dev/docs: "https://forgejo.webgrip.dev/webgrip/unfold-cluster/src/branch/main/docs/runbooks/unfold-staging.md"
    wellhead.dev/verify: "http"
    wellhead.dev/verify.http.url: "https://vikunja.webgrip.dev/api/v1/projects"
    wellhead.dev/verify.http.auth: "bearer:api-token"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-homelab
  target:
    name: ploeg-vikunja-bot
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: VIKUNJA_API_TOKEN
      remoteRef:
        key: unfold-main/staging/vikunja
        property: api-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ploeg-webhook-secret
  annotations:
    wellhead.dev/origin: "minted"
    wellhead.dev/docs: "https://forgejo.webgrip.dev/webgrip/unfold-cluster/src/branch/main/docs/runbooks/unfold-staging.md"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-homelab
  target:
    name: ploeg-webhook-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: PLOEG_VIKUNJA_SECRET
      remoteRef:
        key: unfold-main/staging/vikunja
        property: webhook-secret
