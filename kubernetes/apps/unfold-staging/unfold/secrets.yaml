---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: token
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unfold-credentials
  annotations:
    wellhead.dev/origin: "minted"
spec:
  refreshInterval: "0"
  target:
    name: unfold-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: token
      rewrite:
        - regexp:
            source: password
            target: PLOEG_OPERATOR_UNFOLD_TOKEN
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: token
      rewrite:
        - regexp:
            source: password
            target: UNFOLD_ADMIN_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickup-bot
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "The ClickUp personal API token (Settings, Apps) of the Ploeg bot, the member Unfold. Seed it from this repository with mise run wellhead -- seed unfold-staging/clickup-bot."
    wellhead.dev/docs: "https://forgejo.webgrip.dev/webgrip/unfold-cluster/src/branch/main/docs/runbooks/unfold-staging.md#clickup"
    wellhead.dev/verify: "http"
    wellhead.dev/verify.http.url: "https://api.clickup.com/api/v2/user"
    wellhead.dev/verify.http.auth: "header:Authorization:api-token"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-homelab
  target:
    name: clickup-bot
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: CLICKUP_API_TOKEN
      remoteRef:
        key: unfold-main/staging/clickup
        property: api-token
