---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: unfold
spec:
  description: The workbench answers the tunnel connector, its own agent workspaces and the chart's Helm test pod on 4080. It reaches ploegd, staging's LiteLLM, the Kubernetes API (it creates the workspace pods), Forgejo and the ClickUp API over HTTPS by name, and the homelab Authentik only through authentik-relay. Its lookups go through Cilium's DNS proxy so the FQDN rules learn Forgejo's and ClickUp's addresses.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: unfold
      app.kubernetes.io/instance: unfold
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: unfold-staging-edge
            app.kubernetes.io/name: cloudflared
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: unfold-staging-workspaces
        - matchLabels:
            app.kubernetes.io/name: unfold-smoke-test
            app.kubernetes.io/instance: unfold
      toPorts:
        - ports:
            - port: "4080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "**.cluster.local"
              - matchName: forgejo.webgrip.dev
              - matchName: api.clickup.com
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: ploeg
            ploeg.webgrip.dev/component: daemon
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: litellm-staging
            app.kubernetes.io/name: litellm
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: authentik-relay
      toPorts:
        - ports:
            - port: "3128"
              protocol: TCP
    - toFQDNs:
        - matchName: forgejo.webgrip.dev
        - matchName: api.clickup.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ploegd
spec:
  description: Adds to the chart's NetworkPolicy what it cannot express. The tunnel connector may only POST to /webhooks/, so Cloudflare Access and Unfold's sign-in are not bypassed through ploegd's other routes. ploegd reaches Forgejo and the ClickUp API over HTTPS by name, through Cilium's DNS proxy.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: ploeg
      ploeg.webgrip.dev/component: daemon
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: unfold-staging-edge
            app.kubernetes.io/name: cloudflared
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - method: POST
                path: "/webhooks/.*"
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "**.cluster.local"
              - matchName: forgejo.webgrip.dev
              - matchName: api.clickup.com
    - toFQDNs:
        - matchName: forgejo.webgrip.dev
        - matchName: api.clickup.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-relay
spec:
  description: The relay carries the workbench's sign-in calls to the homelab Authentik through the homelab gateway, which only the hub's tailnet tag may open on 443 (ADR 0006). It forwards one authority, authentik.webgrip.dev:443. It resolves unfold-gateway.webgrip.dev through Cilium's DNS proxy, which is how the FQDN rule learns the gateway's tailnet address, and may open nothing else.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: authentik-relay
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: unfold
            app.kubernetes.io/instance: unfold
      toPorts:
        - ports:
            - port: "3128"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: unfold-gateway.webgrip.dev
    - toFQDNs:
        - matchName: unfold-gateway.webgrip.dev
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: unfold-smoke-test
spec:
  description: The chart's Helm test pod, which Flux runs after every upgrade and rolls back on when it fails, asks the workbench for /readyz, /healthz and /api/auth/methods on 4080. Beyond that and default-dns, which resolves the workbench's Service name, it may open nothing.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: unfold-smoke-test
      app.kubernetes.io/instance: unfold
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: unfold
            app.kubernetes.io/instance: unfold
      toPorts:
        - ports:
            - port: "4080"
              protocol: TCP
