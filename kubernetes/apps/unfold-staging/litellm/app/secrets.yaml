---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-homelab
  target:
    name: litellm-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: unfold-main/staging/litellm
        property: master-key
    - secretKey: LITELLM_SALT_KEY
      remoteRef:
        key: unfold-main/staging/litellm
        property: salt-key
    - secretKey: FIREWORKS_AI_API_KEY
      remoteRef:
        key: unfold-main/staging/litellm
        property: fireworks-api-key
    - secretKey: HETZNER_INFERENCE_API_KEY
      remoteRef:
        key: unfold-main/staging/litellm
        property: hetzner-inference-api-key
