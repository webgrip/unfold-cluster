---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: litellm-key
spec:
  length: 64
  digits: 16
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-generated
spec:
  refreshInterval: "0"
  target:
    name: litellm-generated
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        LITELLM_MASTER_KEY: 'sk-{{ .master }}'
        LITELLM_SALT_KEY: '{{ .salt }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: litellm-key
      rewrite:
        - regexp:
            source: password
            target: master
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: litellm-key
      rewrite:
        - regexp:
            source: password
            target: salt
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-homelab
  target:
    name: litellm-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: FIREWORKS_AI_API_KEY
      remoteRef:
        key: unfold-main/staging/litellm
        property: fireworks-api-key
    - secretKey: HETZNER_INFERENCE_API_KEY
      remoteRef:
        key: unfold-main/staging/litellm
        property: hetzner-inference-api-key
