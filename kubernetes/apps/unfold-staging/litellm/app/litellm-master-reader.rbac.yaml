---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: litellm-master-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["litellm-generated"]
    verbs: ["get"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: litellm-master-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: litellm-master-reader
subjects:
  - kind: ServiceAccount
    name: litellm-master-reader
    namespace: unfold-staging
