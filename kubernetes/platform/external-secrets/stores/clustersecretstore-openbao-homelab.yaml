---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-homelab
spec:
  conditions:
    - namespaceSelector:
        matchLabels:
          external-secrets.webgrip.io/openbao-homelab: allowed
  provider:
    vault:
      server: http://unfold-gateway.webgrip.dev:8200
      path: secret
      version: v2
      auth:
        jwt:
          path: jwt-unfold-main
          role: unfold-main-external-secrets
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: openbao-homelab
              namespace: external-secrets
              audiences:
                - openbao-homelab
            expirationSeconds: 600
