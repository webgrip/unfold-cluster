---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-homelab
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-openbao-homelab-token
rules:
  - apiGroups:
      - ""
    resources:
      - serviceaccounts/token
    resourceNames:
      - openbao-homelab
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-openbao-homelab-token
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-secrets-openbao-homelab-token
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
