---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-secrets-apiserver
spec:
  description: Every External Secrets pod talks to the Kubernetes API, and the API server calls the admission webhook on 10250. In tunnel mode a call from a control plane reaches the pod from that node's tunnel address, which Cilium labels host or remote-node rather than kube-apiserver, so the webhook port admits those identities too. Nothing else reaches these pods.
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
  ingress:
    - fromEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-secrets-openbao-homelab
spec:
  description: The controller reads the homelab OpenBao, the only original of every secret, at unfold-gateway.webgrip.dev:8200. That name resolves to the homelab gateway's tailnet address; its lookups go through Cilium's DNS proxy, which is how this rule learns the address, and the controller may open nothing else outside the cluster.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: unfold-gateway.webgrip.dev
              - matchPattern: "*.cluster.local"
    - toFQDNs:
        - matchName: unfold-gateway.webgrip.dev
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
