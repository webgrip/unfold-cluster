---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  interval: 1h
  releaseName: external-secrets
  chartRef:
    kind: OCIRepository
    name: external-secrets
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    installCRDs: true
    rbac:
      serviceAccountTokenCreate: false
      aggregateToEdit: false
      aggregateToAdmin: false
    global:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    image:
      # renovate: datasource=docker depName=ghcr.io/external-secrets/external-secrets
      tag: v2.11.0@sha256:66fb710878cbf3eba4a927e35c5d75e29a202c9bab238aad64bfb23b786b962b
    priorityClassName: system-cluster-critical
    resources:
      requests:
        cpu: 20m
        memory: 96Mi
      limits:
        memory: 256Mi
        ephemeral-storage: 256Mi
    webhook:
      image:
        # renovate: datasource=docker depName=ghcr.io/external-secrets/external-secrets
        tag: v2.11.0@sha256:66fb710878cbf3eba4a927e35c5d75e29a202c9bab238aad64bfb23b786b962b
      priorityClassName: system-cluster-critical
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          memory: 128Mi
          ephemeral-storage: 256Mi
    certController:
      image:
        # renovate: datasource=docker depName=ghcr.io/external-secrets/external-secrets
        tag: v2.11.0@sha256:66fb710878cbf3eba4a927e35c5d75e29a202c9bab238aad64bfb23b786b962b
      priorityClassName: system-cluster-critical
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          memory: 128Mi
          ephemeral-storage: 256Mi
