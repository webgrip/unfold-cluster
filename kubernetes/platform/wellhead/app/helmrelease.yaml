---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wellhead
spec:
  interval: 1h
  releaseName: wellhead
  chart:
    spec:
      chart: ./deploy/charts/wellhead
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: wellhead
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    admissionPolicy:
      enabled: true
      validationActions: [Warn, Audit]
    kyverno:
      enabled: false
