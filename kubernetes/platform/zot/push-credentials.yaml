---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zot-push-credentials
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zot-push-credentials
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["zot-push-credentials"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zot-push-credentials
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zot-push-credentials
subjects:
  - kind: ServiceAccount
    name: zot-push-credentials
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zot-push-credentials-consumer
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["zot-push-credentials"]
    verbs: ["get", "patch"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: zot-push-credentials
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zot-push-credentials
    spec:
      restartPolicy: OnFailure
      serviceAccountName: zot-push-credentials
      nodeSelector:
        node.webgrip.io/pool: unfold
      tolerations:
        - key: node.webgrip.io/pool
          operator: Equal
          value: unfold
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ensure
          image: docker.io/alpine/kubectl:1.37.1@sha256:a5d0fbecab3f7b6c2ab7398f1daa73a3e0ed6ece18556d21698233e9e3759cc7
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              umask 077
              cd /tmp
              if ! kubectl get secret zot-push-credentials >/dev/null 2>&1; then
                head -c 64 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 40 > new-password
                printf '%s:%s\n' "$PUSH_USER" "$(cryptpw -s -m sha512 < new-password)" > new-htpasswd
                printf '%s' "$PUSH_USER" > new-username
                kubectl create secret generic zot-push-credentials \
                  --from-file=username=new-username \
                  --from-file=password=new-password \
                  --from-file=htpasswd=new-htpasswd
                echo "created zot-push-credentials for user $PUSH_USER"
              fi
              kubectl get secret zot-push-credentials -o jsonpath='{.data.username}' | base64 -d > username
              kubectl get secret zot-push-credentials -o jsonpath='{.data.password}' | base64 -d > password
              auth="$(printf '%s:%s' "$(cat username)" "$(cat password)" | base64 | tr -d '\n')"
              printf '{"auths":{"%s":{"auth":"%s"}}}' "$REGISTRY" "$auth" > dockerconfig.json
              for namespace in $CONSUMER_NAMESPACES; do
                if kubectl auth can-i patch secrets/zot-push-credentials -n "$namespace" >/dev/null 2>&1; then
                  kubectl -n "$namespace" create secret generic zot-push-credentials \
                    --type=kubernetes.io/dockerconfigjson \
                    --from-file=.dockerconfigjson=dockerconfig.json \
                    --from-file=username=username \
                    --from-file=password=password \
                    --dry-run=client -o yaml \
                    | kubectl -n "$namespace" apply --server-side --field-manager=zot-push-credentials --force-conflicts -f -
                else
                  echo "skipped $namespace: it has no RoleBinding to the ClusterRole zot-push-credentials-consumer"
                fi
              done
          env:
            - name: HOME
              value: /tmp
            - name: PUSH_USER
              value: ci
            - name: REGISTRY
              value: zot.zot.svc.cluster.local:5000
            - name: CONSUMER_NAMESPACES
              value: ci
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
