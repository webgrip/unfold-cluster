---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata
handler: kata
overhead:
  podFixed:
    cpu: 100m
    memory: 160Mi
scheduling:
  nodeSelector:
    runtime.webgrip.io/kata: "true"
  tolerations:
    - key: node.webgrip.io/pool
      operator: Equal
      value: metal
      effect: NoSchedule
