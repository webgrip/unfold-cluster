---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ops-gateway
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager-issuers
  interval: 1h
  retryInterval: 2m
  path: ./kubernetes/platform/ops-consoles/gateway
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ops-auth
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets-stores
    - name: ops-gateway
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  path: ./kubernetes/platform/ops-consoles/auth
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: policy-reporter
  namespace: flux-system
spec:
  dependsOn:
    - name: kyverno
    - name: trivy-operator
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  path: ./kubernetes/platform/ops-consoles/policy-reporter
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: headlamp
  namespace: flux-system
spec:
  dependsOn:
    - name: ops-gateway
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  path: ./kubernetes/platform/ops-consoles/headlamp
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
