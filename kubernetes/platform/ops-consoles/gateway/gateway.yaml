---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ops
spec:
  gatewayClassName: cilium
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.ops.unfoldhq.dev"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: ops-wildcard-tls
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway.webgrip.io/ops: allowed
