---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ops-wildcard
spec:
  secretName: ops-wildcard-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-production
  dnsNames:
    - "*.ops.unfoldhq.dev"
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
