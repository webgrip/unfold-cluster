---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: unfold-admission
spec:
  allowCrossNamespaceImport: true
  folderRef: unfold
  instanceSelector:
    matchLabels:
      grafana.webgrip.io/instance: unfold
  datasources:
    - inputName: DS_AUDIT
      datasourceName: victorialogs-audit
  json: |
    {
      "uid": "unfold-admission-denials",
      "title": "Unfold / Admission denials (API audit log)",
      "tags": [
        "unfold",
        "ops-consoles",
        "admission",
        "audit"
      ],
      "schemaVersion": 41,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Denials, 24h",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${DS_AUDIT}"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 8,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${DS_AUDIT}"
              },
              "expr": "job:=kube-audit responseStatus.message:~\"ValidatingAdmissionPolicy|admission webhook\" | stats count() denials",
              "queryType": "stats"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Refused tokens (401), 24h",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${DS_AUDIT}"
          },
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 8,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${DS_AUDIT}"
              },
              "expr": "job:=kube-audit responseStatus.code:=401 | stats count() refused",
              "queryType": "stats"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "RBAC refusals (403), 24h",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${DS_AUDIT}"
          },
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 8,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${DS_AUDIT}"
              },
              "expr": "job:=kube-audit responseStatus.code:=403 -responseStatus.message:~\"ValidatingAdmissionPolicy|admission webhook\" | stats count() refused",
              "queryType": "stats"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "id": 4,
          "type": "table",
          "title": "Denials by user, namespace and resource",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${DS_AUDIT}"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 24,
            "h": 10
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${DS_AUDIT}"
              },
              "expr": "job:=kube-audit responseStatus.message:~\"ValidatingAdmissionPolicy|admission webhook\" | stats by (user.username, objectRef.namespace, objectRef.resource, verb) count() denials | sort by (denials desc) | limit 50",
              "queryType": "stats",
              "format": "table"
            }
          ]
        },
        {
          "id": 5,
          "type": "logs",
          "title": "Latest denials, with the policy's message",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${DS_AUDIT}"
          },
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 24,
            "h": 10
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${DS_AUDIT}"
              },
              "expr": "job:=kube-audit responseStatus.message:~\"ValidatingAdmissionPolicy|admission webhook\"",
              "queryType": "stats"
            }
          ]
        }
      ],
      "editable": false
    }
