---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: unfold-trivy
spec:
  allowCrossNamespaceImport: true
  folderRef: unfold
  instanceSelector:
    matchLabels:
      grafana.webgrip.io/instance: unfold
  datasources:
    - inputName: DS_METRICS
      datasourceName: unfold-prometheus
  json: |
    {
      "uid": "unfold-trivy",
      "title": "Unfold / Vulnerabilities (Trivy)",
      "tags": [
        "unfold",
        "ops-consoles",
        "supply-chain"
      ],
      "schemaVersion": 41,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Critical",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_METRICS}"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_METRICS}"
              },
              "expr": "sum(trivy_image_vulnerabilities{severity=\"Critical\"})",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "High",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_METRICS}"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_METRICS}"
              },
              "expr": "sum(trivy_image_vulnerabilities{severity=\"High\"})",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Images with a critical",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_METRICS}"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_METRICS}"
              },
              "expr": "count(sum by (namespace, image_repository, image_tag) (trivy_image_vulnerabilities{severity=\"Critical\"}) > 0)",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Secrets found in images",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_METRICS}"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_METRICS}"
              },
              "expr": "sum(trivy_image_exposedsecrets) or vector(0)",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "id": 5,
          "type": "table",
          "title": "Images by severity",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_METRICS}"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 24,
            "h": 10
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_METRICS}"
              },
              "expr": "sum by (namespace, image_repository, image_tag, severity) (trivy_image_vulnerabilities) > 0",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ]
        },
        {
          "id": 6,
          "type": "table",
          "title": "Critical and high CVEs",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_METRICS}"
          },
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 24,
            "h": 10
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_METRICS}"
              },
              "expr": "count by (vuln_id, severity, resource, installed_version, fixed_version) (trivy_vulnerability_id{severity=~\"Critical|High\"})",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ]
        }
      ],
      "editable": false
    }
