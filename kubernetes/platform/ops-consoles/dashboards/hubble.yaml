---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: unfold-hubble
spec:
  allowCrossNamespaceImport: true
  folderRef: unfold
  instanceSelector:
    matchLabels:
      grafana.webgrip.io/instance: unfold
  datasources:
    - inputName: DS_METRICS
      datasourceName: unfold-prometheus
    - inputName: DS_LOGS
      datasourceName: victorialogs
  json: |
    {
      "uid": "unfold-hubble-egress",
      "title": "Unfold / Egress verdicts (Hubble)",
      "tags": [
        "unfold",
        "ops-consoles",
        "network"
      ],
      "schemaVersion": 41,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Dropped flows, 1h",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_METRICS}"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_METRICS}"
              },
              "expr": "sum(increase(hubble_drop_total[1h])) or vector(0)",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Policy denials, 1h",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_METRICS}"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_METRICS}"
              },
              "expr": "sum(increase(hubble_policy_verdicts_total{action=\"dropped\"}[1h])) or vector(0)",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Egress denied by name, 24h",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${DS_LOGS}"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${DS_LOGS}"
              },
              "expr": "source:=hubble-egress verdict:=DROPPED | stats count() flows",
              "queryType": "stats"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Distinct egress destinations, 24h",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${DS_LOGS}"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${DS_LOGS}"
              },
              "expr": "source:=hubble-egress | stats count_uniq(destination_name) destinations",
              "queryType": "stats"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "id": 5,
          "type": "table",
          "title": "Egress by workload and destination",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${DS_LOGS}"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 24,
            "h": 12
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${DS_LOGS}"
              },
              "expr": "source:=hubble-egress | stats by (source_namespace, source_workload, destination_name, destination_port, verdict, allowed_by) count() flows | sort by (flows desc) | limit 100",
              "queryType": "stats",
              "format": "table"
            }
          ]
        },
        {
          "id": 6,
          "type": "table",
          "title": "Drops by reason",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_METRICS}"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_METRICS}"
              },
              "expr": "sum by (reason) (increase(hubble_drop_total[1h])) > 0",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ]
        },
        {
          "id": 7,
          "type": "table",
          "title": "Policy verdicts by workload",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_METRICS}"
          },
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_METRICS}"
              },
              "expr": "sum by (source_workload, destination_workload, action, match) (increase(hubble_policy_verdicts_total[1h])) > 0",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ]
        }
      ],
      "editable": false,
      "links": [
        {
          "title": "Hubble UI",
          "url": "https://hubble.ops.unfoldhq.dev",
          "type": "link",
          "targetBlank": true
        }
      ]
    }
