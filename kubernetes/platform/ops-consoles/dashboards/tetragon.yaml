---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: unfold-tetragon
spec:
  allowCrossNamespaceImport: true
  folderRef: unfold
  instanceSelector:
    matchLabels:
      grafana.webgrip.io/instance: unfold
  datasources:
    - inputName: DS_LOGS
      datasourceName: victorialogs
  json: |
    {
      "uid": "unfold-tetragon",
      "title": "Unfold / Runtime events (Tetragon)",
      "tags": [
        "unfold",
        "ops-consoles",
        "runtime-security"
      ],
      "schemaVersion": 41,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Events, 24h",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${DS_LOGS}"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${DS_LOGS}"
              },
              "expr": "source:=tetragon | stats count() events",
              "queryType": "stats"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Privilege changes, 24h",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${DS_LOGS}"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${DS_LOGS}"
              },
              "expr": "source:=tetragon privileges_changed:!\"\" | stats count() events",
              "queryType": "stats"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Credential reads, 24h",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${DS_LOGS}"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${DS_LOGS}"
              },
              "expr": "source:=tetragon policy:=runtime-kubernetes-credentials | stats count() events",
              "queryType": "stats"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Outbound connects, 24h",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${DS_LOGS}"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${DS_LOGS}"
              },
              "expr": "source:=tetragon policy:=runtime-outbound-connects | stats count() events",
              "queryType": "stats"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "id": 5,
          "type": "table",
          "title": "By policy and workload",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${DS_LOGS}"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 24,
            "h": 10
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${DS_LOGS}"
              },
              "expr": "source:=tetragon policy:!\"\" | stats by (policy, namespace, workload, binary) count() events | sort by (events desc) | limit 50",
              "queryType": "stats",
              "format": "table"
            }
          ]
        },
        {
          "id": 6,
          "type": "logs",
          "title": "Latest events",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${DS_LOGS}"
          },
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 24,
            "h": 10
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${DS_LOGS}"
              },
              "expr": "source:=tetragon policy:!\"\"",
              "queryType": "stats"
            }
          ]
        }
      ],
      "editable": false
    }
