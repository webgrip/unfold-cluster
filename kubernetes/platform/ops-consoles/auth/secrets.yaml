---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ops-consoles-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-homelab
  target:
    name: ops-consoles-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client_secret
      remoteRef:
        key: unfold-main/ops-consoles/oidc
        property: client_secret
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: oauth2-proxy-cookie
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-hubble-cookie
spec:
  refreshInterval: "0"
  target:
    name: oauth2-proxy-hubble-cookie
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: oauth2-proxy-cookie
      rewrite:
        - regexp:
            source: password
            target: cookie_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-policy-reporter-cookie
spec:
  refreshInterval: "0"
  target:
    name: oauth2-proxy-policy-reporter-cookie
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: oauth2-proxy-cookie
      rewrite:
        - regexp:
            source: password
            target: cookie_secret
