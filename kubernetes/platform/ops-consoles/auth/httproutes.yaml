---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble
spec:
  parentRefs:
    - name: ops
      namespace: ops-gateway
      sectionName: https
  hostnames:
    - hubble.ops.unfoldhq.dev
  rules:
    - backendRefs:
        - name: oauth2-proxy-hubble
          port: 4180
      timeouts:
        request: 0s
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: policy-reporter
spec:
  parentRefs:
    - name: ops
      namespace: ops-gateway
      sectionName: https
  hostnames:
    - policy-reporter.ops.unfoldhq.dev
  rules:
    - backendRefs:
        - name: oauth2-proxy-policy-reporter
          port: 4180
