---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator-polr-adapter
spec:
  interval: 1h
  releaseName: trivy-operator-polr-adapter
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: trivy-operator-polr-adapter
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  values:
    image:
      registry: ghcr.io
      repository: fjogeleit/trivy-operator-polr-adapter
      # renovate: datasource=docker depName=ghcr.io/fjogeleit/trivy-operator-polr-adapter
      tag: 0.11.5@sha256:37029b4d464f2b6a0076129a34b06a39385237f679abe4daf25c4b93d7f01218
    crds:
      install: false
    adapters:
      vulnerabilityReports:
        enabled: true
      configAuditReports:
        enabled: true
      exposedSecretReports:
        enabled: true
      rbacAssessmentReports:
        enabled: true
    podSecurityContext:
      fsGroup: 1234
      runAsNonRoot: true
      runAsUser: 1234
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 192Mi
        ephemeral-storage: 32Mi
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node.webgrip.io/pool
                  operator: In
                  values:
                    - system
                    - unfold
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: node.webgrip.io/pool
                  operator: In
                  values:
                    - system
          - weight: 50
            preference:
              matchExpressions:
                - key: node.webgrip.io/pool
                  operator: In
                  values:
                    - unfold
    tolerations:
      - key: node.webgrip.io/pool
        operator: Equal
        value: system
        effect: NoSchedule
      - key: node.webgrip.io/pool
        operator: Equal
        value: unfold
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
