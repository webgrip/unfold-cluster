---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: policy-reporter
spec:
  interval: 1h
  releaseName: policy-reporter
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: policy-reporter
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  values:
    image:
      registry: ghcr.io
      repository: kyverno/policy-reporter
      # renovate: datasource=docker depName=ghcr.io/kyverno/policy-reporter
      tag: 3.11.2@sha256:2b33409d34be3195f16d9ed2c89f8b58001aeec986b254ba6bb45323d6d1e884
    replicaCount: 1
    revisionHistoryLimit: 2
    serviceAccount:
      automount: true
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 160Mi
        ephemeral-storage: 64Mi
    sqliteVolume:
      emptyDir:
        sizeLimit: 64Mi
    tmpVolume:
      emptyDir:
        sizeLimit: 16Mi
    rest:
      enabled: true
    metrics:
      enabled: false
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node.webgrip.io/pool
                  operator: In
                  values:
                    - system
                    - unfold
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: node.webgrip.io/pool
                  operator: In
                  values:
                    - system
          - weight: 50
            preference:
              matchExpressions:
                - key: node.webgrip.io/pool
                  operator: In
                  values:
                    - unfold
    tolerations:
      - key: node.webgrip.io/pool
        operator: Equal
        value: system
        effect: NoSchedule
      - key: node.webgrip.io/pool
        operator: Equal
        value: unfold
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    ui:
      enabled: true
      image:
        registry: ghcr.io
        repository: kyverno/policy-reporter-ui
        # renovate: datasource=docker depName=ghcr.io/kyverno/policy-reporter-ui
        tag: 2.9.1@sha256:642762427ef5bc941b22f51f6e7c5c8f116a0635132239d11fc89826edbd3eaf
      replicaCount: 1
      revisionHistoryLimit: 2
      name: Unfold production
      displayMode: dark
      serviceAccount:
        automount: true
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          memory: 96Mi
          ephemeral-storage: 32Mi
      tmpVolume:
        emptyDir:
          sizeLimit: 16Mi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.webgrip.io/pool
                    operator: In
                    values:
                      - system
                      - unfold
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node.webgrip.io/pool
                    operator: In
                    values:
                      - system
            - weight: 50
              preference:
                matchExpressions:
                  - key: node.webgrip.io/pool
                    operator: In
                    values:
                      - unfold
      tolerations:
        - key: node.webgrip.io/pool
          operator: Equal
          value: system
          effect: NoSchedule
        - key: node.webgrip.io/pool
          operator: Equal
          value: unfold
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
