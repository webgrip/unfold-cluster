---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager-metrics
spec:
  description: cert-manager's controller metrics (certificate expiry) answer alloy-metrics in observability on 9402, and nothing else reaches that port.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: controller
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: alloy-metrics
      toPorts:
        - ports:
            - port: "9402"
              protocol: TCP
