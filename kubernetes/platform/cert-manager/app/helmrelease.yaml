---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  interval: 1h
  releaseName: cert-manager
  chartRef:
    kind: OCIRepository
    name: cert-manager
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
      keep: true
    global:
      priorityClassName: platform-critical
    replicaCount: 1
    enableCertificateOwnerRef: true
    dns01RecursiveNameservers: https://cloudflare-dns.com/dns-query
    dns01RecursiveNameserversOnly: true
    image:
      # renovate: datasource=docker depName=quay.io/jetstack/cert-manager-controller
      tag: v1.21.3@sha256:9f4f96a33c7774cef24466fcd85031997531a03a8d117f151126baa8d1290dcc
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node.webgrip.io/pool
                  operator: In
                  values:
                    - system
    tolerations:
      - key: node.webgrip.io/pool
        operator: Equal
        value: system
        effect: NoSchedule
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
        ephemeral-storage: 256Mi
    prometheus:
      enabled: true
      servicemonitor:
        enabled: false
    webhook:
      image:
        # renovate: datasource=docker depName=quay.io/jetstack/cert-manager-webhook
        tag: v1.21.3@sha256:055ac8e9de6a0ba6763794838fe38944acc650f68ebe1b01dd8be079e580f458
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.webgrip.io/pool
                    operator: In
                    values:
                      - system
      tolerations:
        - key: node.webgrip.io/pool
          operator: Equal
          value: system
          effect: NoSchedule
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
          ephemeral-storage: 256Mi
      livenessProbe:
        timeoutSeconds: 5
        failureThreshold: 5
      readinessProbe:
        timeoutSeconds: 5
        failureThreshold: 5
    cainjector:
      image:
        # renovate: datasource=docker depName=quay.io/jetstack/cert-manager-cainjector
        tag: v1.21.3@sha256:083d0e906f8eb44e255fe4ff817ae54e49f9ed82e22f1011bb4e9e4f4b8a641f
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.webgrip.io/pool
                    operator: In
                    values:
                      - system
      tolerations:
        - key: node.webgrip.io/pool
          operator: Equal
          value: system
          effect: NoSchedule
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
          ephemeral-storage: 256Mi
    startupapicheck:
      enabled: false
