---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dns01-canary
spec:
  secretName: dns01-canary-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-staging
  dnsNames:
    - dns01-canary.unfold.unfoldhq.dev
  duration: 2160h
  renewBefore: 1440h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
