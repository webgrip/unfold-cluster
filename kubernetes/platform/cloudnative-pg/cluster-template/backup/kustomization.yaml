---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - s3-credentials.externalsecret.yaml
  - objectstore.yaml
  - scheduledbackup.yaml
  - networkpolicy.yaml
  - restore-drill.rbac.yaml
  - restore-drill.cronjob.yaml
patches:
  - target:
      group: postgresql.cnpg.io
      kind: Cluster
    patch: |-
      - op: add
        path: /spec/plugins
        value:
          - name: barman-cloud.cloudnative-pg.io
            isWALArchiver: true
            parameters:
              barmanObjectName: ${CNPG_CLUSTER}-backup
