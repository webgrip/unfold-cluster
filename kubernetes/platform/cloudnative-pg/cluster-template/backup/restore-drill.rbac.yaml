---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${CNPG_CLUSTER}-restore-drill
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${CNPG_CLUSTER}-restore-drill
rules:
  - apiGroups:
      - postgresql.cnpg.io
    resources:
      - clusters
    verbs:
      - create
  - apiGroups:
      - postgresql.cnpg.io
    resources:
      - clusters
    resourceNames:
      - ${CNPG_CLUSTER}-drill
    verbs:
      - get
      - list
      - watch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${CNPG_CLUSTER}-restore-drill
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${CNPG_CLUSTER}-restore-drill
subjects:
  - kind: ServiceAccount
    name: ${CNPG_CLUSTER}-restore-drill
