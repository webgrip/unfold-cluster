---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${CNPG_CLUSTER}-backup-s3
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "Hetzner Console, the project's Object Storage, Security, S3 credentials: one pair with write access to this cluster's backup bucket in nbg1."
    wellhead.dev/plain: "access-key-id"
    wellhead.dev/verify: "format"
    wellhead.dev/verify.format.access-key-id: "[A-Za-z0-9]{16,64}"
    wellhead.dev/verify.format.secret-access-key: "\\S{30,}"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-homelab
  target:
    name: ${CNPG_CLUSTER}-backup-s3
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: access-key-id
      remoteRef:
        key: ${CNPG_BACKUP_WRITER_CREDENTIALS_KEY:=unfold-main/cnpg-backup/hetzner-nbg1-writer}
        property: access-key-id
    - secretKey: secret-access-key
      remoteRef:
        key: ${CNPG_BACKUP_WRITER_CREDENTIALS_KEY:=unfold-main/cnpg-backup/hetzner-nbg1-writer}
        property: secret-access-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${CNPG_CLUSTER}-backup-s3-reader
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "Hetzner Console, the project's Object Storage, Security, S3 credentials: one pair with read access to this cluster's backup bucket in nbg1, used for restores."
    wellhead.dev/plain: "access-key-id"
    wellhead.dev/verify: "format"
    wellhead.dev/verify.format.access-key-id: "[A-Za-z0-9]{16,64}"
    wellhead.dev/verify.format.secret-access-key: "\\S{30,}"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-homelab
  target:
    name: ${CNPG_CLUSTER}-backup-s3-reader
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: access-key-id
      remoteRef:
        key: ${CNPG_BACKUP_READER_CREDENTIALS_KEY:=unfold-main/cnpg-backup/hetzner-nbg1-reader}
        property: access-key-id
    - secretKey: secret-access-key
      remoteRef:
        key: ${CNPG_BACKUP_READER_CREDENTIALS_KEY:=unfold-main/cnpg-backup/hetzner-nbg1-reader}
        property: secret-access-key
