---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${CNPG_CLUSTER}-backup-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-homelab
  target:
    name: ${CNPG_CLUSTER}-backup-s3
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: access-key-id
      remoteRef:
        key: ${CNPG_BACKUP_WRITER_CREDENTIALS_KEY:=unfold-main/cnpg-backup/hetzner-nbg1-writer}
        property: access-key-id
    - secretKey: secret-access-key
      remoteRef:
        key: ${CNPG_BACKUP_WRITER_CREDENTIALS_KEY:=unfold-main/cnpg-backup/hetzner-nbg1-writer}
        property: secret-access-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${CNPG_CLUSTER}-backup-s3-reader
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-homelab
  target:
    name: ${CNPG_CLUSTER}-backup-s3-reader
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: access-key-id
      remoteRef:
        key: ${CNPG_BACKUP_READER_CREDENTIALS_KEY:=unfold-main/cnpg-backup/hetzner-nbg1-reader}
        property: access-key-id
    - secretKey: secret-access-key
      remoteRef:
        key: ${CNPG_BACKUP_READER_CREDENTIALS_KEY:=unfold-main/cnpg-backup/hetzner-nbg1-reader}
        property: secret-access-key
