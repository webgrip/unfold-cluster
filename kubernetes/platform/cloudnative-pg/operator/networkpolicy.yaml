---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cloudnative-pg-operator
spec:
  description: The operator talks to the Kubernetes API, asks every Postgres instance for its status on 8000, and calls the barman-cloud plugin over mutual TLS on 9090. The API server calls its admission webhook on 9443; in tunnel mode that call arrives from a control plane's tunnel address, which Cilium labels host or remote-node, so the webhook port admits those identities too.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  ingress:
    - fromEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: Exists
            - key: cnpg.io/podRole
              operator: In
              values:
                - instance
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: plugin-barman-cloud
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
