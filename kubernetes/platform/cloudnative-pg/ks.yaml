---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  path: ./kubernetes/platform/cloudnative-pg/operator
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: plugin-barman-cloud
  namespace: flux-system
spec:
  dependsOn:
    - name: cloudnative-pg
    - name: cert-manager
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  path: ./kubernetes/platform/cloudnative-pg/plugin-barman-cloud
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
