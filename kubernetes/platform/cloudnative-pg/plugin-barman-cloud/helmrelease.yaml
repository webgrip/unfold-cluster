---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
spec:
  interval: 1h
  releaseName: plugin-barman-cloud
  chartRef:
    kind: OCIRepository
    name: plugin-barman-cloud
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    replicaCount: 1
    additionalArgs:
      - --leader-elect=false
    image:
      registry: ghcr.io
      repository: cloudnative-pg/plugin-barman-cloud
      # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/plugin-barman-cloud
      tag: v0.15.1@sha256:c75acad19a36e8176cfe2885761ff1b836c6ef977d7257e298c99a28b5c302ef
    sidecarImage:
      registry: ghcr.io
      repository: cloudnative-pg/plugin-barman-cloud-sidecar
      # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/plugin-barman-cloud-sidecar
      tag: v0.15.1@sha256:2287a793a804db751edd0d07d44cd549e357677e98a800eb12e2cf7c0d53f9b0
    priorityClassName: system-cluster-critical
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node.webgrip.io/pool
                  operator: In
                  values:
                    - system
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: node.webgrip.io/pool
                  operator: In
                  values:
                    - system

    tolerations:
      - key: node.webgrip.io/pool
        operator: Equal
        value: system
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
        ephemeral-storage: 256Mi
