---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vmsingle
  labels:
    app.kubernetes.io/name: vmsingle
    observability.webgrip.io/placement: central
spec:
  replicas: 1
  serviceName: vmsingle
  selector:
    matchLabels:
      app.kubernetes.io/name: vmsingle
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmsingle
    spec:
      priorityClassName: platform-critical
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vmsingle
          # renovate: datasource=docker depName=docker.io/victoriametrics/victoria-metrics
          image: docker.io/victoriametrics/victoria-metrics:v1.148.0@sha256:407013e902f9a0ba1d4b2d4c077c47bbaf917c893c52ff39b19efe83a654afda
          args:
            - -httpListenAddr=:8428
            - -storageDataPath=/storage
            - -retentionPeriod=30d
            - -storage.minFreeDiskSpaceBytes=1GB
            - -search.maxUniqueTimeseries=300000
            - -memory.allowedPercent=60
            - -loggerFormat=json
          ports:
            - name: http
              containerPort: 8428
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              memory: 2Gi
              ephemeral-storage: 128Mi
          volumeMounts:
            - name: storage
              mountPath: /storage
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: hcloud-luks
        resources:
          requests:
            storage: 20Gi
