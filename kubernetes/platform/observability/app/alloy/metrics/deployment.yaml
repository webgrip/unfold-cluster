---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy-metrics
  labels:
    app.kubernetes.io/name: alloy-metrics
    observability.webgrip.io/placement: central
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy-metrics
    spec:
      serviceAccountName: alloy-metrics
      securityContext:
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        fsGroup: 473
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alloy
          # renovate: datasource=docker depName=docker.io/grafana/alloy
          image: docker.io/grafana/alloy:v1.21.2@sha256:89a5a320168387336b9ac3c850609c3ba7757eadd4ae5f1d819deb35e9854b18
          args:
            - run
            - /etc/alloy
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy
            - --disable-reporting
          ports:
            - name: http
              containerPort: 12345
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 320Mi
            limits:
              memory: 768Mi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: wal
              mountPath: /var/lib/alloy
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: alloy-metrics
        - name: wal
          emptyDir:
            sizeLimit: 1536Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
