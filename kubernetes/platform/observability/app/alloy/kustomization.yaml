---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rbac.yaml
  - metrics/deployment.yaml
  - logs/daemonset.yaml
configMapGenerator:
  - name: alloy-metrics
    files:
      - metrics/metrics.alloy
  - name: alloy-logs
    files:
      - logs/node-files.alloy
      - logs/talos.alloy
      - logs/pipelines.alloy
      - logs/sinks.alloy
