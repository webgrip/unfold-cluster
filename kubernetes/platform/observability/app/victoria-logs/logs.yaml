---
apiVersion: v1
kind: Service
metadata:
  name: vlsingle-logs
  labels:
    app.kubernetes.io/name: vlsingle-logs
spec:
  selector:
    app.kubernetes.io/name: vlsingle-logs
  ports:
    - name: http
      port: 9428
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vlsingle-logs
  labels:
    app.kubernetes.io/name: vlsingle-logs
    observability.webgrip.io/placement: central
spec:
  replicas: 1
  serviceName: vlsingle-logs
  selector:
    matchLabels:
      app.kubernetes.io/name: vlsingle-logs
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vlsingle-logs
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vlsingle
          # renovate: datasource=docker depName=docker.io/victoriametrics/victoria-logs
          image: docker.io/victoriametrics/victoria-logs:v1.53.0@sha256:251121fa882af99b95ba0c230a4a2f412ea602d2698c64a96c58dc9842bb755d
          args:
            - -httpListenAddr=:9428
            - -storageDataPath=/storage
            - -retentionPeriod=14d
            - -retention.maxDiskSpaceUsageBytes=13GiB
            - -memory.allowedPercent=60
            - -loggerFormat=json
          ports:
            - name: http
              containerPort: 9428
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
              ephemeral-storage: 128Mi
          volumeMounts:
            - name: storage
              mountPath: /storage
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: hcloud-luks
        resources:
          requests:
            storage: 15Gi
