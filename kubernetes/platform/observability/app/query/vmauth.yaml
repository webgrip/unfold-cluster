users:
  - name: homelab-grafana
    bearer_token: "%{QUERY_TOKEN}"
    url_map:
      - src_paths:
          - /api/v1/query
          - /api/v1/query_range
          - /api/v1/series
          - /api/v1/labels
          - /api/v1/label/[^/]+/values
          - /api/v1/metadata
          - /api/v1/status/buildinfo
          - /api/v1/query_exemplars
        url_prefix: http://vmsingle.observability.svc.cluster.local:8428
      - src_paths:
          - /select/logsql/.+
        url_prefix: http://vlsingle-logs.observability.svc.cluster.local:9428
