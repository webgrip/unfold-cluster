---
apiVersion: v1
kind: Service
metadata:
  name: vmauth-query
  labels:
    app.kubernetes.io/name: vmauth-query
spec:
  selector:
    app.kubernetes.io/name: vmauth-query
  ports:
    - name: http
      port: 8427
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmauth-query
  labels:
    app.kubernetes.io/name: vmauth-query
    observability.webgrip.io/placement: central
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vmauth-query
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmauth-query
    spec:
      priorityClassName: platform-background
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vmauth
          # renovate: datasource=docker depName=docker.io/victoriametrics/vmauth
          image: docker.io/victoriametrics/vmauth:v1.148.0@sha256:46b832a5a25bf3888783a8bbf84273825129aba8977972c85605765bcb49448b
          args:
            - -httpListenAddr=:8427
            - -auth.config=/config/vmauth.yaml
            - -configCheckInterval=1m
            - -loggerFormat=json
          env:
            - name: QUERY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: observability-query-token
                  key: token
          ports:
            - name: http
              containerPort: 8427
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
              ephemeral-storage: 64Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: vmauth-query
