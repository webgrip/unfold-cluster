---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  labels:
    app.kubernetes.io/name: alertmanager
spec:
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  labels:
    app.kubernetes.io/name: alertmanager
    observability.webgrip.io/placement: central
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
    spec:
      priorityClassName: platform-critical
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager
          # renovate: datasource=docker depName=quay.io/prometheus/alertmanager
          image: quay.io/prometheus/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
          args:
            - --config.file=/etc/alertmanager/config/alertmanager.yml
            - --storage.path=/alertmanager
            - --web.listen-address=:9093
            - --web.external-url=https://grafana.ops.unfoldhq.dev/alerting
            - --web.route-prefix=/
            - --cluster.listen-address=
            - --log.format=json
          ports:
            - name: http
              containerPort: 9093
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 128Mi
              ephemeral-storage: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager/config
              readOnly: true
            - name: ntfy
              mountPath: /etc/alertmanager/ntfy
              readOnly: true
            - name: deadman
              mountPath: /etc/alertmanager/deadman
              readOnly: true
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager
        - name: ntfy
          secret:
            secretName: alertmanager-ntfy
            optional: true
        - name: deadman
          secret:
            secretName: alertmanager-deadman
            optional: true
        - name: data
          emptyDir:
            sizeLimit: 64Mi
