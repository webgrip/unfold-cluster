---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert-metrics
  labels:
    app.kubernetes.io/name: vmalert-metrics
    observability.webgrip.io/placement: central
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vmalert-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmalert-metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vmalert
          # renovate: datasource=docker depName=docker.io/victoriametrics/vmalert
          image: docker.io/victoriametrics/vmalert:v1.148.0@sha256:268ab5df69360a236e1382db0dbde44d5c32362b85501f761d61fc25c76f05ce
          args:
            - -httpListenAddr=:8880
            - -rule=/rules/*.yaml
            - -datasource.url=http://vmsingle.observability.svc.cluster.local:8428
            - -remoteWrite.url=http://vmsingle.observability.svc.cluster.local:8428
            - -remoteRead.url=http://vmsingle.observability.svc.cluster.local:8428
            - -notifier.url=http://alertmanager.observability.svc.cluster.local:9093
            - -external.label=cluster=unfold
            - -external.url=https://grafana.ops.unfoldhq.dev
            - -evaluationInterval=1m
            - -configCheckInterval=1m
            - -loggerFormat=json
          ports:
            - name: http
              containerPort: 8880
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 192Mi
              ephemeral-storage: 64Mi
          volumeMounts:
            - name: rules
              mountPath: /rules
              readOnly: true
      volumes:
        - name: rules
          configMap:
            name: vmalert-metrics-rules
