---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
spec:
  parentRefs:
    - name: ops
      namespace: ops-gateway
      sectionName: https
  hostnames:
    - grafana.ops.unfoldhq.dev
  rules:
    - backendRefs:
        - name: grafana-service
          port: 3000
