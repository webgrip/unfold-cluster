---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - grafana.yaml
  - datasources.yaml
  - folder.yaml
  - dashboards/dashboards.yaml
  - httproutes.yaml
  - ../../ops-consoles/dashboards
configMapGenerator:
  - name: grafana-dashboards
    files:
      - dashboards/unfold-cluster.json
      - dashboards/unfold-supply-chain.json
    options:
      disableNameSuffixHash: true
