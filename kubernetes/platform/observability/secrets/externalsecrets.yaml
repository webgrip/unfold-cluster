---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observability-query-token
  annotations:
    wellhead.dev/origin: "minted"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-homelab
  target:
    name: observability-query-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: unfold-main/observability/query-token
        property: token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-ntfy
  annotations:
    wellhead.dev/origin: "minted"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-homelab
  target:
    name: alertmanager-ntfy
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: unfold-main/alertmanager/ntfy
        property: token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-deadman
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "uptime-kuma on the off-site box: add a Push monitor for Unfold's Alertmanager Watchdog (heartbeat every 2 minutes, retry 3) and copy its push URL."
    wellhead.dev/docs: "https://forgejo.webgrip.dev/webgrip/unfold-cluster/src/branch/main/docs/observability.md"
    wellhead.dev/verify: "format"
    wellhead.dev/verify.format.ping_url: "https://\\S+/api/push/\\S+"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-homelab
  target:
    name: alertmanager-deadman
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ping_url
      remoteRef:
        key: unfold-main/alertmanager/deadman
        property: ping_url
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  annotations:
    wellhead.dev/origin: "minted"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-homelab
  target:
    name: grafana-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client_secret
      remoteRef:
        key: unfold-main/grafana/oidc
