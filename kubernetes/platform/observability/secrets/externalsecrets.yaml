---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observability-query-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-homelab
  target:
    name: observability-query-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: unfold-main/observability/query-token
        property: token
