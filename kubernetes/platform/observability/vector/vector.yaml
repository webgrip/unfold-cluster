data_dir: /var/lib/vector
api:
  enabled: false
sources:
  pods:
    type: kubernetes_logs
    self_node_name: ${VECTOR_SELF_NODE_NAME}
    glob_minimum_cooldown_ms: 2000
  talos_services:
    type: socket
    mode: tcp
    address: 127.0.0.1:6050
    decoding:
      codec: json
    framing:
      method: newline_delimited
  talos_kernel:
    type: socket
    mode: tcp
    address: 127.0.0.1:6051
    decoding:
      codec: json
    framing:
      method: newline_delimited
  kube_audit:
    type: file
    include:
      - /var/log/audit/kube/*.log
    read_from: end
    fingerprint:
      strategy: device_and_inode
  hubble_egress_flows:
    type: file
    include:
      - /var/log/hubble/egress-flows.log
    fingerprint:
      strategy: device_and_inode
  tetragon_events:
    type: file
    include:
      - /var/log/tetragon/tetragon.log
    fingerprint:
      strategy: device_and_inode
  vector_metrics:
    type: internal_metrics
transforms:
  pod_records:
    type: remap
    inputs:
      - pods
    source: |
      . = {
        "timestamp": .timestamp,
        "message": .message,
        "stream": .stream,
        "source": "pod",
        "node": .kubernetes.pod_node_name,
        "namespace": .kubernetes.pod_namespace,
        "pod": .kubernetes.pod_name,
        "container": .kubernetes.container_name,
        "app": .kubernetes.pod_labels."app.kubernetes.io/name"
      }
  talos_records:
    type: remap
    inputs:
      - talos_services
      - talos_kernel
    source: |
      talos_time = del(."talos-time")
      .timestamp = if is_string(talos_time) { talos_time } else { now() }
      .message = del(.msg)
      .level = del(."talos-level")
      talos_service = del(."talos-service")
      .talos_service = if is_string(talos_service) { talos_service } else { "kernel" }
      .source = "talos"
      .node = get_env_var("VECTOR_SELF_NODE_NAME") ?? "unknown"
  audit_records:
    type: remap
    inputs:
      - kube_audit
    drop_on_error: true
    source: |
      . = parse_json!(string!(.message))
      .job = "kube-audit"
      .node = get_env_var("VECTOR_SELF_NODE_NAME") ?? "unknown"
  egress_flow_records:
    type: remap
    inputs:
      - hubble_egress_flows
    drop_on_error: true
    source: |
      event = parse_json!(string!(.message))
      flow = object!(event.flow)
      names = join(array(flow.destination_names) ?? [], ",") ?? ""
      destination = if names != "" { names } else { string(flow.IP.destination) ?? "unknown" }
      tcp_port = flow.l4.TCP.destination_port
      port_number = if tcp_port != null { tcp_port } else { flow.l4.UDP.destination_port }
      port = if port_number == null { "" } else { to_string(port_number) ?? "" }
      source_namespace = string(flow.source.namespace) ?? ""
      source_workload = string(flow.source.workloads[0].name) ?? string(flow.source.pod_name) ?? "host"
      verdict = string(flow.verdict) ?? "UNKNOWN"
      allowed_by = join(map_values(array(flow.egress_allowed_by) ?? []) -> |policy| {
        (string(policy.kind) ?? "") + "/" + (string(policy.namespace) ?? "") + "/" + (string(policy.name) ?? "")
      }, ",") ?? ""
      denied_by = join(map_values(array(flow.egress_denied_by) ?? []) -> |policy| {
        (string(policy.kind) ?? "") + "/" + (string(policy.namespace) ?? "") + "/" + (string(policy.name) ?? "")
      }, ",") ?? ""
      . = flow
      .timestamp = event.time
      .source = "hubble-egress"
      .source_namespace = source_namespace
      .source_workload = source_workload
      .destination_name = destination
      .destination_port = port
      .allowed_by = allowed_by
      .denied_by = denied_by
      .node = get_env_var("VECTOR_SELF_NODE_NAME") ?? "unknown"
      .message = source_namespace + "/" + source_workload + " -> " + destination + ":" + port + " " + verdict
  tetragon_records:
    type: remap
    inputs:
      - tetragon_events
    drop_on_error: true
    source: |
      event = object!(parse_json!(string!(.message)))
      del(event.node_labels)
      kind = if exists(event.process_exec) {
        "process_exec"
      } else if exists(event.process_kprobe) {
        "process_kprobe"
      } else if exists(event.process_lsm) {
        "process_lsm"
      } else if exists(event.process_tracepoint) {
        "process_tracepoint"
      } else if exists(event.rate_limit_info) {
        "rate_limit_info"
      } else {
        "other"
      }
      body = object(get(event, [kind]) ?? {}) ?? {}
      process = object(body.process) ?? {}
      parent = object(body.parent) ?? {}
      pod = object(process.pod) ?? {}
      path = ""
      daddr = ""
      dport = ""
      string_args = []
      for_each(array(body.args) ?? []) -> |_index, argument| {
        if path == "" {
          path = string(argument.file_arg.path) ?? string(argument.path_arg.path) ?? ""
        }
        if daddr == "" {
          daddr = string(argument.sock_arg.daddr) ?? ""
          dport = if is_integer(argument.sock_arg.dport) { to_string!(argument.sock_arg.dport) } else { "" }
        }
        if is_string(argument.string_arg) {
          string_args = push(string_args, string!(argument.string_arg))
        }
      }
      privileges = array(process.binary_properties.privileges_changed) ?? []
      namespace = string(pod.namespace) ?? ""
      pod_name = string(pod.name) ?? ""
      binary = string(process.binary) ?? ""
      policy = string(body.policy_name) ?? ""
      target = if path != "" { path } else if daddr != "" { daddr + ":" + dport } else { join(string_args, " ") }
      . = {
        "timestamp": event.time,
        "source": "tetragon",
        "event": kind,
        "node": string(event.node_name) ?? get_env_var("VECTOR_SELF_NODE_NAME") ?? "unknown",
        "namespace": namespace,
        "pod": pod_name,
        "container": string(pod.container.name) ?? "",
        "workload": string(pod.workload) ?? "",
        "workload_kind": string(pod.workload_kind) ?? "",
        "image": string(pod.container.image.name) ?? "",
        "isolation_class": string(get(pod, ["pod_labels", "ploeg.webgrip.dev/isolation-class"]) ?? "") ?? "",
        "binary": binary,
        "arguments": string(process.arguments) ?? "",
        "uid": process.uid,
        "in_init_tree": bool(process.in_init_tree) ?? false,
        "parent_binary": string(parent.binary) ?? "",
        "privileges_changed": join(map_values(privileges) -> |reason| { string(reason) ?? "" }, ",") ?? "",
        "policy": policy,
        "function": string(body.function_name) ?? "",
        "action": string(body.action) ?? "",
        "path": path,
        "daddr": daddr,
        "dport": dport,
        "string_args": join(string_args, " "),
        "tetragon": event
      }
      location = if namespace == "" { "host" } else { namespace + "/" + pod_name }
      detail = if policy == "" { "" } else { " " + policy + " " + target }
      .message = kind + " " + location + " " + binary + detail
  audit_kept:
    type: filter
    inputs:
      - audit_records
    condition: |
      user = string(.user.username) ?? ""
      verb = string(.verb) ?? ""
      resource = string(.objectRef.resource) ?? ""
      subresource = string(.objectRef.subresource) ?? ""
      routine_read = starts_with(user, "system:") &&
        includes(["get", "list", "watch"], verb) &&
        !match(resource, r'^(secrets|serviceaccounts|.*roles|.*rolebindings|certificatesigningrequests)$') &&
        !includes(["exec", "attach", "portforward"], subresource)
      status_write = subresource == "status" && includes(["update", "patch"], verb)
      !routine_read && !status_write
sinks:
  homelab_audit:
    type: http
    inputs:
      - audit_kept
    uri: http://unfold-gateway.webgrip.dev:8427/audit/insert/jsonline
    method: post
    compression: gzip
    encoding:
      codec: json
    framing:
      method: newline_delimited
    batch:
      max_bytes: 4000000
      timeout_secs: 2
    request:
      timeout_secs: 60
      headers:
        Content-Type: application/x-ndjson
    buffer:
      type: disk
      max_size: 1073741824
      when_full: block
  homelab:
    type: http
    inputs:
      - pod_records
      - talos_records
      - egress_flow_records
      - tetragon_records
    uri: http://unfold-gateway.webgrip.dev:8427/insert/jsonline
    method: post
    compression: gzip
    encoding:
      codec: json
    framing:
      method: newline_delimited
    batch:
      max_bytes: 4000000
      timeout_secs: 2
    request:
      timeout_secs: 60
      headers:
        Content-Type: application/x-ndjson
    buffer:
      type: disk
      max_size: 2147483648
      when_full: block
  metrics:
    type: prometheus_exporter
    inputs:
      - vector_metrics
    address: 0.0.0.0:9598
