global:
  scrape_interval: 30s
  scrape_timeout: 10s
  external_labels:
    cluster: unfold
scrape_configs:
  - job_name: vmagent
    static_configs:
      - targets:
          - 127.0.0.1:8429

  - job_name: apiserver
    scheme: https
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - default
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        regex: kubernetes;https
        action: keep
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket|apiserver_request_sli_duration_seconds_bucket|etcd_request_duration_seconds_bucket
        action: drop

  - job_name: kubelet
    scheme: https
    kubernetes_sd_configs:
      - role: node
    tls_config:
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node

  - job_name: cadvisor
    scheme: https
    metrics_path: /metrics/cadvisor
    kubernetes_sd_configs:
      - role: node
    tls_config:
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: container_(blkio_device_usage_total|tasks_state|memory_failures_total)
        action: drop

  - job_name: etcd
    scheme: http
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__meta_kubernetes_node_labelpresent_node_role_kubernetes_io_control_plane]
        regex: "true"
        action: keep
      - source_labels: [__meta_kubernetes_node_address_InternalIP]
        regex: (.+)
        replacement: $1:2383
        target_label: __address__
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node

  - job_name: kube-state-metrics
    honor_labels: true
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - observability
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        regex: kube-state-metrics;http
        action: keep

  - job_name: node-exporter
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - observability
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_number]
        regex: prometheus-node-exporter;9100
        action: keep
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node

  - job_name: vector
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - observability
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
        regex: vector;metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node

  - job_name: cilium
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - kube-system
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_k8s_app, __meta_kubernetes_pod_container_port_name]
        regex: cilium;(prometheus|hubble-metrics)
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        target_label: component
        regex: prometheus
        replacement: agent
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        target_label: component
        regex: hubble-metrics
        replacement: hubble
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node

  - job_name: cilium-operator
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - kube-system
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_io_cilium_app, __meta_kubernetes_pod_container_port_name]
        regex: operator;prometheus
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  - job_name: coredns
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - kube-system
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_k8s_app, __meta_kubernetes_pod_container_port_name]
        regex: kube-dns;metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  - job_name: flux
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - flux-system
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: http-prom|http-metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_name]
        target_label: controller
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
