---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmagent
  labels:
    app.kubernetes.io/name: vmagent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vmagent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmagent
    spec:
      serviceAccountName: vmagent
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: node.webgrip.io/pool
          operator: Equal
          value: unfold
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vmagent
          # renovate: datasource=docker depName=docker.io/victoriametrics/vmagent
          image: docker.io/victoriametrics/vmagent:v1.153.0@sha256:474135388ae700b842007d3e186a8ae60ccf7de3dfd776fb6ed27cf8522d8331
          args:
            - -httpListenAddr=:8429
            - -promscrape.config=/config/scrape.yaml
            - -promscrape.config.strictParse=true
            - -remoteWrite.url=http://unfold-gateway.webgrip.dev:8427/api/v1/write
            - -remoteWrite.tmpDataPath=/buffer
            - -remoteWrite.maxDiskUsagePerURL=1800MB
            - -remoteWrite.flushInterval=5s
            - -remoteWrite.sendTimeout=1m
          ports:
            - name: http
              containerPort: 8429
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
              ephemeral-storage: 3Gi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: buffer
              mountPath: /buffer
      volumes:
        - name: config
          configMap:
            name: vmagent-scrape
        - name: buffer
          emptyDir:
            sizeLimit: 2Gi
