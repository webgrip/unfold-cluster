---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pinned-approved-images
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
  variables:
    - name: allowedPrefixes
      expression: >-
        ['ghcr.io/siderolabs/',
        'ghcr.io/external-secrets/external-secrets:',
        'ghcr.io/kedacore/keda:',
        'ghcr.io/kedacore/keda-metrics-apiserver:',
        'ghcr.io/kedacore/keda-admission-webhooks:',
        'code.forgejo.org/forgejo/runner:',
        'docker.io/moby/buildkit:',
        'docker.io/library/node:',
        'ghcr.io/project-zot/zot:',
        'docker.io/alpine/kubectl:',
        'docker.io/victoriametrics/vmagent:',
        'docker.io/timberio/vector:',
        'quay.io/prometheus/node-exporter:',
        'registry.k8s.io/kube-state-metrics/kube-state-metrics:']
    - name: images
      expression: >-
        object.spec.containers.map(c, c.image)
        + (has(object.spec.initContainers) ? object.spec.initContainers.map(c, c.image) : [])
        + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers.map(c, c.image) : [])
        + (has(object.spec.volumes) ? object.spec.volumes.filter(v, has(v.image)).map(v, has(v.image.reference) ? v.image.reference : '') : [])
    - name: unapproved
      expression: >-
        variables.images.filter(i, !variables.allowedPrefixes.exists(p, i.startsWith(p)))
  validations:
    - expression: variables.images.all(i, i.contains('@sha256:'))
      messageExpression: >-
        'every image must be pinned by digest; not pinned: ' + variables.images.filter(i, !i.contains('@sha256:')).join(', ')
      reason: Forbidden
    - expression: variables.unapproved.size() == 0
      messageExpression: >-
        'images must come from an approved repository (' + variables.allowedPrefixes.join(', ') + '); refused: ' + variables.unapproved.join(', ')
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pinned-approved-images
spec:
  policyName: pinned-approved-images
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - flux-system
