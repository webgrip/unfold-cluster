---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: host-access
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  matchConditions:
    - name: creates-or-changes-the-pod-template
      expression: >-
        request.operation != 'UPDATE' || object.kind == 'Pod'
        || (object.kind == 'CronJob'
          ? object.spec.jobTemplate != oldObject.spec.jobTemplate
          : object.spec.template != oldObject.spec.template)
  variables:
    - name: spec
      expression: >-
        object.kind == 'Pod' ? object.spec :
        (object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec : object.spec.template.spec)
    - name: containers
      expression: >-
        variables.spec.?containers.orValue([])
        + variables.spec.?initContainers.orValue([])
        + variables.spec.?ephemeralContainers.orValue([])
    - name: controllingOwners
      expression: >-
        object.metadata.?ownerReferences.orValue([]).filter(o, o.?controller.orValue(false))
    - name: podTemplateHash
      expression: object.metadata.?labels[?'pod-template-hash'].orValue('')
    - name: workload
      expression: >-
        variables.controllingOwners.size() != 1
        ? request.namespace + '/' + object.kind + '/' + object.metadata.name
        : (variables.controllingOwners[0].kind == 'ReplicaSet' && variables.podTemplateHash != ''
            && variables.controllingOwners[0].name.endsWith('-' + variables.podTemplateHash)
          ? request.namespace + '/Deployment/' + variables.controllingOwners[0].name.substring(0,
              variables.controllingOwners[0].name.size() - variables.podTemplateHash.size() - 1)
          : request.namespace + '/' + variables.controllingOwners[0].kind + '/' + variables.controllingOwners[0].name)
    - name: hostAccessGrants
      expression: >-
        {
          'observability/DaemonSet/node-exporter': [
            'hostNetwork', 'hostPID', 'hostPort:9100',
            'readOnlyHostPath:/', 'readOnlyHostPath:/proc', 'readOnlyHostPath:/sys'],
          'observability/DaemonSet/alloy-logs': [
            'hostNetwork', 'hostPort:9598',
            'readOnlyHostPath:/var/log', 'writableHostPath:/var/lib/alloy']
        }
    - name: granted
      expression: variables.hostAccessGrants[?variables.workload].orValue([])
    - name: hostPathVolumes
      expression: variables.spec.?volumes.orValue([]).filter(v, has(v.hostPath))
    - name: writableHostPathMounts
      expression: >-
        variables.containers.map(c, c.?volumeMounts.orValue([])
          .filter(m, !m.?readOnly.orValue(false))
          .map(m, variables.hostPathVolumes.filter(v, v.name == m.name).map(v, v.hostPath.path)))
  validations:
    - expression: >-
        variables.containers.all(c, !c.?securityContext.?privileged.orValue(false))
      message: privileged containers run only in the system namespaces.
      reason: Forbidden
    - expression: >-
        (!variables.spec.?hostNetwork.orValue(false) || 'hostNetwork' in variables.granted)
        && (!variables.spec.?hostPID.orValue(false) || 'hostPID' in variables.granted)
        && !variables.spec.?hostIPC.orValue(false)
      messageExpression: >-
        'hostNetwork, hostPID and hostIPC are allowed only in the system namespaces and for the workloads granted them; '
        + variables.workload + ' is granted: [' + variables.granted.join(', ') + ']'
      reason: Forbidden
    - expression: >-
        variables.hostPathVolumes.all(v,
          ('readOnlyHostPath:' + v.hostPath.path) in variables.granted
          || ('writableHostPath:' + v.hostPath.path) in variables.granted)
      messageExpression: >-
        'hostPath volumes are allowed only in the system namespaces and for the paths a workload is granted; '
        + variables.workload + ' is granted: [' + variables.granted.join(', ') + ']'
      reason: Forbidden
    - expression: >-
        variables.writableHostPathMounts.all(perContainer, perContainer.all(paths,
          paths.all(path, ('writableHostPath:' + path) in variables.granted)))
      messageExpression: >-
        'a hostPath must be mounted readOnly unless the workload is granted it writable; '
        + variables.workload + ' is granted: [' + variables.granted.join(', ') + ']'
      reason: Forbidden
    - expression: >-
        variables.containers.all(c, c.?ports.orValue([]).all(p,
          p.?hostPort.orValue(0) == 0 || ('hostPort:' + string(p.hostPort)) in variables.granted))
      messageExpression: >-
        'hostPort is allowed only in the system namespaces and for the ports a workload is granted; '
        + variables.workload + ' is granted: [' + variables.granted.join(', ') + ']'
      reason: Forbidden
    - expression: >-
        variables.containers.all(c,
          !c.?securityContext.?windowsOptions.?hostProcess.orValue(false))
        && !variables.spec.?securityContext.?windowsOptions.?hostProcess.orValue(false)
      message: Windows host processes are not allowed.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: host-access
spec:
  policyName: host-access
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
