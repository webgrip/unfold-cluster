---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: operator-externalsecret-sync
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["external-secrets.io"]
        apiVersions: ["*"]
        operations: ["UPDATE"]
        resources: ["externalsecrets"]
  matchConditions:
    - name: a-person-in-unfold-admins
      expression: "'oidc:unfold-admins' in request.userInfo.groups"
  variables:
    - name: annotations
      expression: object.metadata.?annotations.orValue({})
    - name: oldAnnotations
      expression: oldObject.metadata.?annotations.orValue({})
    - name: changedAnnotations
      expression: >-
        variables.annotations.filter(k, k != 'force-sync'
          && (!(k in variables.oldAnnotations) || variables.oldAnnotations[k] != variables.annotations[k]))
        + variables.oldAnnotations.filter(k, k != 'force-sync' && !(k in variables.annotations))
  validations:
    - expression: object.spec == oldObject.spec
      message: an operator may only set the force-sync annotation on an ExternalSecret; its spec changes through Git
      reason: Forbidden
    - expression: variables.changedAnnotations.size() == 0
      messageExpression: >-
        "an operator may only set the force-sync annotation on an ExternalSecret; changed: "
        + variables.changedAnnotations.join(', ')
      reason: Forbidden
    - expression: >-
        object.metadata.?labels.orValue({}) == oldObject.metadata.?labels.orValue({})
        && object.metadata.?finalizers.orValue([]) == oldObject.metadata.?finalizers.orValue([])
        && object.metadata.?ownerReferences.orValue([]) == oldObject.metadata.?ownerReferences.orValue([])
      message: an operator may only set the force-sync annotation on an ExternalSecret; labels, finalizers and owners change through Git
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: operator-externalsecret-sync
spec:
  policyName: operator-externalsecret-sync
  validationActions: ["Deny"]
