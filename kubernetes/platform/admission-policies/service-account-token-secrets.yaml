---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: service-account-token-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets"]
  validations:
    - expression: object.?type.orValue('Opaque') != 'kubernetes.io/service-account-token'
      message: >-
        long-lived service-account token Secrets are refused; pods get bound, expiring tokens from
        the TokenRequest API.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: service-account-token-secrets
spec:
  policyName: service-account-token-secrets
  validationActions: ["Audit", "Warn"]
