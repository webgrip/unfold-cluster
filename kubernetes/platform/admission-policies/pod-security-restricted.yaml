---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pod-security-restricted
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  matchConditions:
    - name: creates-or-changes-the-pod-template
      expression: >-
        request.operation != 'UPDATE' || object.kind == 'Pod'
        || (object.kind == 'CronJob'
          ? object.spec.jobTemplate != oldObject.spec.jobTemplate
          : object.spec.template != oldObject.spec.template)
  variables:
    - name: spec
      expression: >-
        object.kind == 'Pod' ? object.spec :
        (object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec : object.spec.template.spec)
    - name: containers
      expression: >-
        variables.spec.?containers.orValue([])
        + variables.spec.?initContainers.orValue([])
        + variables.spec.?ephemeralContainers.orValue([])
    - name: confinedSeccompTypes
      expression: "['RuntimeDefault', 'Localhost']"
    - name: safeSysctls
      expression: >-
        ['kernel.shm_rmid_forced', 'net.ipv4.ip_local_port_range', 'net.ipv4.ip_unprivileged_port_start',
        'net.ipv4.tcp_syncookies', 'net.ipv4.ping_group_range', 'net.ipv4.ip_local_reserved_ports',
        'net.ipv4.tcp_keepalive_time', 'net.ipv4.tcp_fin_timeout', 'net.ipv4.tcp_keepalive_intvl',
        'net.ipv4.tcp_keepalive_probes', 'net.ipv4.tcp_rmem', 'net.ipv4.tcp_wmem']
    - name: containerSELinuxTypes
      expression: "['', 'container_t', 'container_init_t', 'container_kvm_t', 'container_engine_t']"
    - name: controllingOwners
      expression: >-
        object.metadata.?ownerReferences.orValue([]).filter(o, o.?controller.orValue(false))
    - name: podTemplateHash
      expression: object.metadata.?labels[?'pod-template-hash'].orValue('')
    - name: workload
      expression: >-
        variables.controllingOwners.size() != 1
        ? request.namespace + '/' + object.kind + '/' + object.metadata.name
        : (variables.controllingOwners[0].kind == 'ReplicaSet' && variables.podTemplateHash != ''
            && variables.controllingOwners[0].name.endsWith('-' + variables.podTemplateHash)
          ? request.namespace + '/Deployment/' + variables.controllingOwners[0].name.substring(0,
              variables.controllingOwners[0].name.size() - variables.podTemplateHash.size() - 1)
          : request.namespace + '/' + variables.controllingOwners[0].kind + '/' + variables.controllingOwners[0].name)
    - name: workloadGrants
      expression: >-
        {
          'observability/DaemonSet/node-exporter': ['hostPathVolumes'],
          'observability/DaemonSet/vector': ['hostPathVolumes', 'runAsRoot']
        }
    - name: granted
      expression: variables.workloadGrants[?variables.workload].orValue([])
    - name: rootlessBuildKitContainers
      expression: >-
        request.namespace == 'ci' && variables.spec.?runtimeClassName.orValue('') == 'gvisor'
        ? variables.containers.filter(c,
            c.name == 'buildkitd'
            && c.image.startsWith('docker.io/moby/buildkit:')
            && c.image.split('@')[0].endsWith('-rootless')
            && c.image.contains('@sha256:')).map(c, c.name)
        : []
    - name: containersOtherThanRootlessBuildKit
      expression: >-
        variables.containers.filter(c, !(c.name in variables.rootlessBuildKitContainers))
  validations:
    - expression: >-
        'runAsRoot' in variables.granted
        || variables.spec.?securityContext.?runAsNonRoot.orValue(false)
        ? variables.containers.all(c, c.?securityContext.?runAsNonRoot.orValue(true))
        : variables.containers.all(c, c.?securityContext.?runAsNonRoot.orValue(false))
      message: runAsNonRoot must be true for the pod or for every container.
      reason: Forbidden
    - expression: >-
        'runAsRoot' in variables.granted
        || variables.spec.?securityContext.?runAsUser.orValue(1) != 0
        && variables.containers.all(c, c.?securityContext.?runAsUser.orValue(1) != 0)
      message: runAsUser must not be 0.
      reason: Forbidden
    - expression: >-
        variables.containersOtherThanRootlessBuildKit.all(c, c.?securityContext.?allowPrivilegeEscalation.orValue(true) == false)
      message: >-
        every container must set allowPrivilegeEscalation to false; only the rootless BuildKit container
        of a gvisor pod in ci is exempt.
      reason: Forbidden
    - expression: >-
        variables.containersOtherThanRootlessBuildKit.all(c,
          c.?securityContext.?capabilities.?drop.orValue([]).exists(d, d == 'ALL')
          && c.?securityContext.?capabilities.?add.orValue([]).all(a, a == 'NET_BIND_SERVICE'))
        && variables.containers.all(c, c.?securityContext.?capabilities.?add.orValue([]).all(a, a == 'NET_BIND_SERVICE'))
      message: >-
        every container must drop ALL capabilities and may add back only NET_BIND_SERVICE; the rootless
        BuildKit container of a gvisor pod in ci keeps the default set and adds nothing.
      reason: Forbidden
    - expression: >-
        variables.spec.?securityContext.?seccompProfile.?type.orValue('') in variables.confinedSeccompTypes
        ? variables.containers.all(c,
            c.?securityContext.?seccompProfile.?type.orValue('RuntimeDefault') in variables.confinedSeccompTypes)
        : variables.containers.all(c,
            c.?securityContext.?seccompProfile.?type.orValue('') in variables.confinedSeccompTypes)
      message: seccompProfile must be RuntimeDefault or Localhost for the pod or for every container.
      reason: Forbidden
    - expression: >-
        variables.spec.?volumes.orValue([]).all(v,
          (has(v.hostPath) && 'hostPathVolumes' in variables.granted)
          || has(v.configMap) || has(v.csi) || has(v.downwardAPI) || has(v.emptyDir) || has(v.ephemeral)
          || has(v.persistentVolumeClaim) || has(v.projected) || has(v.secret) || has(v.image))
      message: >-
        volumes are limited to configMap, csi, downwardAPI, emptyDir, ephemeral, persistentVolumeClaim,
        projected, secret and image.
      reason: Forbidden
    - expression: >-
        variables.containers.all(c, c.?securityContext.?procMount.orValue('Default') == 'Default')
      message: procMount must be Default.
      reason: Forbidden
    - expression: >-
        variables.spec.?securityContext.?sysctls.orValue([]).all(s, s.name in variables.safeSysctls)
      message: only the Kubernetes safe sysctls may be set.
      reason: Forbidden
    - expression: >-
        variables.spec.?securityContext.?appArmorProfile.?type.orValue('RuntimeDefault') != 'Unconfined'
        && variables.containers.all(c, c.?securityContext.?appArmorProfile.?type.orValue('RuntimeDefault') != 'Unconfined')
      message: appArmorProfile must not be Unconfined.
      reason: Forbidden
    - expression: >-
        variables.spec.?securityContext.?seLinuxOptions.?type.orValue('') in variables.containerSELinuxTypes
        && !variables.spec.?securityContext.?seLinuxOptions.?user.hasValue()
        && !variables.spec.?securityContext.?seLinuxOptions.?role.hasValue()
        && variables.containers.all(c,
          c.?securityContext.?seLinuxOptions.?type.orValue('') in variables.containerSELinuxTypes
          && !c.?securityContext.?seLinuxOptions.?user.hasValue()
          && !c.?securityContext.?seLinuxOptions.?role.hasValue())
      message: seLinuxOptions may only pick a container type and must not set a user or role.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pod-security-restricted
spec:
  policyName: pod-security-restricted
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
