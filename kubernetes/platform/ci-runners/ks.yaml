---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ci-runners
  namespace: flux-system
spec:
  dependsOn:
    - name: keda
    - name: external-secrets
  interval: 1h
  retryInterval: 2m
  path: ./kubernetes/platform/ci-runners/app
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
