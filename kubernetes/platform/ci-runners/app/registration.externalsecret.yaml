---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runner-registration
  namespace: ci
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-homelab
  target:
    name: forgejo-runner-registration
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: unfold-main/ci/forgejo-runner
        property: registration-token
