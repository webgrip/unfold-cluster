---
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: forgejo-rust-runner
  namespace: ci
spec:
  pollingInterval: 15
  minReplicaCount: 0
  maxReplicaCount: 3
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  rollout:
    strategy: gradual
  scalingStrategy:
    strategy: accurate
    pendingPodConditions:
      - Ready
  jobTargetRef:
    parallelism: 1
    completions: 1
    backoffLimit: 0
    activeDeadlineSeconds: 5400
    template:
      metadata:
        annotations:
          cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
        labels:
          app.kubernetes.io/name: forgejo-runner
          app.kubernetes.io/component: rust-ci
          app.kubernetes.io/part-of: unfold-ci
      spec:
        restartPolicy: Never
        runtimeClassName: gvisor
        serviceAccountName: forgejo-runner
        automountServiceAccountToken: false
        enableServiceLinks: false
        terminationGracePeriodSeconds: 30
        priorityClassName: ci-runner
        tolerations:
          - key: node.webgrip.io/pool
            operator: Equal
            value: unfold
            effect: NoSchedule
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: node.webgrip.io/pool
                      operator: In
                      values:
                        - ci
              - weight: 50
                preference:
                  matchExpressions:
                    - key: node.webgrip.io/pool
                      operator: In
                      values:
                        - unfold
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        initContainers:
          - name: register
            image: code.forgejo.org/forgejo/runner:13.2.1@sha256:568cea8c15ddc01fc8f330124892f572af7db37fa28344a2c1914405793bf61d
            command:
              - sh
              - -ec
            args:
              - |
                cp "$(command -v forgejo-runner)" /opt/ci/bin/forgejo-runner
                chmod 0755 /opt/ci/bin/forgejo-runner
                forgejo-runner --config /etc/forgejo-runner/config.yaml register \
                  --no-interactive \
                  --ephemeral \
                  --instance "$FORGEJO_URL" \
                  --name "rust-ci-$POD_NAME" \
                  --token "$(cat /run/forgejo-runner/registration/token)"
            env:
              - name: FORGEJO_URL
                value: https://forgejo.webgrip.dev
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
                ephemeral-storage: 512Mi
            volumeMounts:
              - name: tools
                mountPath: /opt/ci/bin
              - name: runner-config
                mountPath: /etc/forgejo-runner
                readOnly: true
              - name: registration
                mountPath: /run/forgejo-runner/registration
                readOnly: true
              - name: runner-state
                mountPath: /run/forgejo-runner/state
        containers:
          - name: runner
            image: forgejo.webgrip.dev/webgrip/rust-ci-runner:1.4.1@sha256:315684ea932093a86ef2ca53765cba71ee1d06bf7f3ac7b47c85c276247b9c38
            command:
              - sh
              - -ec
            args:
              - |
                mkdir -p "$HOME" "$TMPDIR" /work/act
                exec forgejo-runner --config /etc/forgejo-runner/config.yaml one-job --wait
            env:
              - name: HOME
                value: /work/home
              - name: TMPDIR
                value: /work/tmp
              - name: CARGO_HOME
                value: /work/home/.cargo
              - name: PATH
                value: /opt/ci/bin:/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            workingDir: /work
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: Localhost
                localhostProfile: profiles/ci-runner.json
            readinessProbe:
              exec:
                command:
                  - sh
                  - -c
                  - test -n "$(ls -A /work/act 2>/dev/null)"
              periodSeconds: 5
              timeoutSeconds: 3
            resources:
              requests:
                cpu: "2"
                memory: 4Gi
                ephemeral-storage: 5Gi
              limits:
                memory: 8Gi
                ephemeral-storage: 20Gi
            volumeMounts:
              - name: tools
                mountPath: /opt/ci/bin
                readOnly: true
              - name: runner-config
                mountPath: /etc/forgejo-runner
                readOnly: true
              - name: runner-state
                mountPath: /run/forgejo-runner/state
              - name: work
                mountPath: /work
              - name: tmp
                mountPath: /tmp
        volumes:
          - name: tools
            emptyDir:
              sizeLimit: 256Mi
          - name: runner-state
            emptyDir:
              sizeLimit: 1Mi
          - name: work
            emptyDir:
              sizeLimit: 20Gi
          - name: tmp
            emptyDir:
              sizeLimit: 5Gi
          - name: runner-config
            configMap:
              name: forgejo-rust-runner-config
          - name: registration
            secret:
              secretName: forgejo-runner-registration
              defaultMode: 0440
  triggers:
    - type: metrics-api
      name: waiting-rust-ci-jobs
      metadata:
        url: http://unfold-gateway.webgrip.dev:9150/waiting-jobs/rust-ci
        format: json
        valueLocation: waiting
        targetValue: "1"
