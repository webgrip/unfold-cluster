---
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-node-runner-config
  namespace: ci
data:
  config.yaml: |-
    log:
      level: info
    runner:
      file: /run/forgejo-runner/state/.runner
      capacity: 1
      timeout: 1h
      labels:
        - node-ci:host
    cache:
      enabled: false
    host:
      workdir_parent: /work/act
