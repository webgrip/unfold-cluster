---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-unfold-ci-scaler
  namespace: keda
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-homelab
  target:
    name: forgejo-unfold-ci-scaler
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: unfold-main/ci/forgejo-runner
        property: scaler-token
---
apiVersion: keda.sh/v1alpha1
kind: ClusterTriggerAuthentication
metadata:
  name: forgejo-unfold-ci
spec:
  secretTargetRef:
    - parameter: token
      name: forgejo-unfold-ci-scaler
      key: token
