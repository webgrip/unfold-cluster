---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hcloud-cloud-controller-manager
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 1h
  releaseName: hcloud-cloud-controller-manager
  chart:
    spec:
      chart: hcloud-cloud-controller-manager
      version: 1.39.0
      sourceRef:
        kind: HelmRepository
        name: hetzner
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  valuesFrom:
    - kind: ConfigMap
      name: hcloud-cloud-controller-manager-values
      valuesKey: values.yaml
