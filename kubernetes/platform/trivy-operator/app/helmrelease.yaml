---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
spec:
  interval: 1h
  releaseName: trivy-operator
  timeout: 10m
  chart:
    spec:
      chart: trivy-operator
      version: 0.37.0
      sourceRef:
        kind: HelmRepository
        name: aqua-security
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: StatefulSet
              name: trivy-server
            patch: |
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: trivy-server
              spec:
                template:
                  spec:
                    volumes:
                      - name: tmp-data
                        emptyDir:
                          sizeLimit: 1Gi
                      - name: data
                        emptyDir:
                          sizeLimit: 3Gi
  values:
    fullnameOverride: trivy-operator
    targetNamespaces: ""
    excludeNamespaces: kube-node-lease,kube-public
    targetWorkloads: pod,replicaset,replicationcontroller,statefulset,daemonset,cronjob,job
    operator:
      replicas: 1
      scanJobTTL: 10m
      scanSecretTTL: 10m
      scanJobTimeout: 10m
      scanJobsConcurrentLimit: 1
      scanJobsRetryDelay: 2m
      vulnerabilityScannerEnabled: true
      vulnerabilityScannerScanOnlyCurrentRevisions: true
      sbomGenerationEnabled: true
      clusterSbomCacheEnabled: false
      configAuditScannerEnabled: true
      configAuditScannerScanOnlyCurrentRevisions: true
      rbacAssessmentScannerEnabled: true
      exposedSecretScannerEnabled: true
      infraAssessmentScannerEnabled: false
      clusterComplianceEnabled: false
      scannerReportTTL: 24h
      accessGlobalSecretsAndServiceAccount: false
      builtInTrivyServer: true
      builtInServerRegistryInsecure: true
      metricsFindingsEnabled: true
      metricsVulnIdEnabled: true
      metricsExposedSecretInfo: true
      metricsConfigAuditInfo: false
      metricsRbacAssessmentInfo: false
      metricsImageInfo: true
      webhookBroadcastURL: http://trivy-report-shipper.trivy-system.svc.cluster.local:8080/reports
      webhookBroadcastTimeout: 10s
      webhookSendDeletedReports: false
    image:
      registry: docker.io
      repository: aquasec/trivy-operator
      # renovate: datasource=docker depName=docker.io/aquasec/trivy-operator
      tag: 0.35.0@sha256:4cdb11af98ff409cfa7af980098203a841a5fe957cc6a0bbb0df7668065eb5fa
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        memory: 768Mi
        ephemeral-storage: 256Mi
    volumes:
      - name: cache-policies
        emptyDir:
          sizeLimit: 256Mi
    nodeSelector:
      node.webgrip.io/pool: unfold
    tolerations:
      - key: node.webgrip.io/pool
        operator: Equal
        value: unfold
        effect: NoSchedule
    trivyOperator:
      scanJobsInSameNamespace: false
      scanJobCompressLogs: true
      scanJobAutomountServiceAccountToken: false
      scanJobNodeSelector:
        node.webgrip.io/pool: unfold
      scanJobTolerations:
        - key: node.webgrip.io/pool
          operator: Equal
          value: unfold
          effect: NoSchedule
      scanJobPodTemplatePodSecurityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      scanJobPodTemplateContainerSecurityContext:
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      reportRecordFailedChecksOnly: true
      reportResourceLabels: app.kubernetes.io/name,app.kubernetes.io/instance,app.kubernetes.io/component
    trivy:
      image:
        registry: ghcr.io
        repository: aquasecurity/trivy
        # renovate: datasource=docker depName=ghcr.io/aquasecurity/trivy
        tag: 0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
      mode: ClientServer
      command: image
      storageClassEnabled: false
      sbomSources: ""
      severity: HIGH,CRITICAL
      ignoreUnfixed: false
      slow: true
      timeout: 10m0s
      dbRegistry: zot.zot.svc.cluster.local:5000
      dbRepository: ghcr.io/aquasecurity/trivy-db
      dbRepositoryInsecure: "true"
      javaDbRegistry: zot.zot.svc.cluster.local:5000
      javaDbRepository: ghcr.io/aquasecurity/trivy-java-db
      skipJavaDBUpdate: true
      nonSslRegistries:
        zot: zot.zot.svc.cluster.local:5000
      insecureRegistries:
        zot: zot.zot.svc.cluster.local:5000
      registry:
        mirror:
          "index.docker.io": zot.zot.svc.cluster.local:5000/docker.io
          "ghcr.io": zot.zot.svc.cluster.local:5000/ghcr.io
          "quay.io": zot.zot.svc.cluster.local:5000/quay.io
          "registry.k8s.io": zot.zot.svc.cluster.local:5000/registry.k8s.io
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
          ephemeralStorage: 2Gi
      server:
        replicas: 1
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1536Mi
            ephemeral-storage: 4Gi
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 65534
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
    policiesBundle:
      registry: zot.zot.svc.cluster.local:5000
      repository: ghcr.io/aquasecurity/trivy-checks
      tag: 1
      insecure: true
    serviceMonitor:
      enabled: false
