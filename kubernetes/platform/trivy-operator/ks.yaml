---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trivy-operator
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 15m
  path: ./kubernetes/platform/trivy-operator/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
