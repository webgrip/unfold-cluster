---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hcloud-luks
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-homelab
  target:
    name: hcloud-luks
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: encryption-passphrase
      remoteRef:
        key: unfold-main/hcloud-luks
        property: encryption-passphrase
