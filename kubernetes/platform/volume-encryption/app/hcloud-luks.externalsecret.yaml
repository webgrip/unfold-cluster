---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hcloud-luks
  annotations:
    wellhead.dev/origin: "preserve"
    wellhead.dev/how: "Generated once by the homelab (PushSecret unfold-hcloud-luks, updatePolicy IfNotExists) and escrowed in the password manager. It opens every encrypted volume: if the path is gone, restore the escrowed value, never a new one."
    wellhead.dev/docs: "https://forgejo.webgrip.dev/webgrip/unfold-cluster/src/branch/main/docs/disk-encryption.md"
    wellhead.dev/rotate-on-compromise: "false"
    wellhead.dev/verify: "format"
    wellhead.dev/verify.format.encryption-passphrase: "\\S{32,}"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-homelab
  target:
    name: hcloud-luks
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: encryption-passphrase
      remoteRef:
        key: unfold-main/hcloud-luks
        property: encryption-passphrase
