---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: volume-encryption
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets
  interval: 1h
  retryInterval: 2m
  path: ./kubernetes/platform/volume-encryption/app
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
