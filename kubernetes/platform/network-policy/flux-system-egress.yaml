---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: source-controller-egress
  namespace: flux-system
spec:
  description: 'source-controller fetches this repository from GitHub, the Hetzner chart index and archives from charts.hetzner.cloud, and OCI charts and artifacts from ghcr.io and quay.io, whose blobs are served from their CDNs. Staged: enableDefaultDeny egress is false, so this policy names the flows without blocking any other until it is flipped.'
  endpointSelector:
    matchLabels:
      app: source-controller
  enableDefaultDeny:
    egress: false
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - kube-apiserver
    - toFQDNs:
        - matchName: github.com
        - matchName: charts.hetzner.cloud
        - matchName: ghcr.io
        - matchName: pkg-containers.githubusercontent.com
        - matchName: quay.io
        - matchPattern: "*.quay.io"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flux-operator-egress
  namespace: flux-system
spec:
