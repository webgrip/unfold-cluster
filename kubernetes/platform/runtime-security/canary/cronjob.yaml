---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: runtime-security-canary
spec:
  schedule: "5,35 * * * *"
  timeZone: Europe/Amsterdam
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: runtime-security-canary
            app.kubernetes.io/part-of: runtime-security
        spec:
          restartPolicy: Never
          serviceAccountName: runtime-security-canary
          automountServiceAccountToken: true
          enableServiceLinks: false
          tolerations:
            - key: node.webgrip.io/pool
              operator: Equal
              value: unfold
              effect: NoSchedule
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: canary
              image: docker.io/alpine/kubectl:1.37.1@sha256:a5d0fbecab3f7b6c2ab7398f1daa73a3e0ed6ece18556d21698233e9e3759cc7
              command:
                - /bin/sh
                - /canary/canary.sh
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                  ephemeral-storage: 1Mi
                limits:
                  memory: 32Mi
                  ephemeral-storage: 16Mi
              volumeMounts:
                - name: script
                  mountPath: /canary
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: runtime-security-canary
