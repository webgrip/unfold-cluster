---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tetragon
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  path: ./kubernetes/platform/runtime-security/tetragon
  prune: true
  wait: false
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: tetragon
      namespace: kube-system
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tetragon-policies
  namespace: flux-system
spec:
  dependsOn:
    - name: tetragon
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  path: ./kubernetes/platform/runtime-security/policies
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: runtime-security-canary
  namespace: flux-system
spec:
  dependsOn:
    - name: tetragon-policies
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  path: ./kubernetes/platform/runtime-security/canary
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
