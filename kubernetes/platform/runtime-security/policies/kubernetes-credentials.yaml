---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: runtime-kubernetes-credentials
spec:
  options:
    - name: policy-mode
      value: monitor
  podSelector: {}
  kprobes:
    - call: security_file_open
      syscall: false
      message: "A pod opened a Kubernetes, node or account credential file"
      tags:
        - runtime-security
        - credential-access
      args:
        - index: 0
          type: file
      selectors:
        - matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /var/run/secrets/kubernetes.io/serviceaccount
                - /run/secrets/kubernetes.io/serviceaccount
                - /var/run/secrets/tokens
                - /run/secrets/tokens
                - /var/lib/kubelet/pki
                - /var/lib/kubelet/pods
                - /etc/kubernetes
                - /system/secrets
                - /etc/shadow
        - matchArgs:
            - index: 0
              operator: Postfix
              values:
                - /environ
                - /.kube/config
                - /.docker/config.json
                - /.git-credentials
                - /.netrc
                - /.ssh/id_rsa
                - /.ssh/id_ed25519
                - /.ssh/id_ecdsa
