---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: runtime-kernel-modules
spec:
  options:
    - name: policy-mode
      value: monitor
  kprobes:
    - call: security_kernel_module_request
      syscall: false
      message: "The kernel was asked to load a module automatically"
      tags:
        - runtime-security
        - kernel-tampering
      args:
        - index: 0
          type: string
    - call: security_kernel_read_file
      syscall: false
      message: "A kernel module file is being loaded"
      tags:
        - runtime-security
        - kernel-tampering
      args:
        - index: 0
          type: file
        - index: 1
          type: int
      selectors:
        - matchArgs:
            - index: 1
              operator: Equal
              values:
                - "2"
