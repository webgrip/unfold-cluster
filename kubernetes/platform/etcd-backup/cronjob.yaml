---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup
spec:
  schedule: "17 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: talos-backup
              image: ghcr.io/siderolabs/talos-backup:v0.1.0-beta.3@sha256:05c86663b251a407551dc948097e32e163a345818117eb52c573b0447bd0c7a7
              command:
                - /talos-backup
              workingDir: /tmp
              env:
                - name: CLUSTER_NAME
                  value: unfold-main
                - name: S3_PREFIX
                  value: unfold-main
                - name: BUCKET
                  value: unfold-cluster-etcd
                - name: AWS_REGION
                  value: garage
                - name: CUSTOM_S3_ENDPOINT
                  value: https://s3-offsite.webgrip.dev
                # talos-backup v0.1.0-beta.3 turns path style on when this is "false"
                - name: USE_PATH_STYLE
                  value: "false"
                - name: ENABLE_COMPRESSION
                  value: "false"
              envFrom:
                - secretRef:
                    name: etcd-backup
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
                  ephemeral-storage: 3Gi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: talos-config
                  mountPath: /.talos
                - name: talos-secrets
                  mountPath: /var/run/secrets/talos.dev
                  readOnly: true
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 2Gi
            - name: talos-config
              emptyDir:
                sizeLimit: 16Mi
            - name: talos-secrets
              secret:
                secretName: talos-backup
