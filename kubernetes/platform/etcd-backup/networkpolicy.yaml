---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: etcd-backup
spec:
  description: The backup job reaches the Talos API on the nodes to take a snapshot and the off-site bucket over HTTPS to store it, nothing else.
  endpointSelector: {}
  egress:
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "50000"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
