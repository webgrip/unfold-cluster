cluster:
  name: unfold-main
  id: 2
ipam:
  mode: kubernetes
kubeProxyReplacement: true
k8sServiceHost: localhost
k8sServicePort: 7445
routingMode: tunnel
tunnelProtocol: vxlan
MTU: 1400
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi
envoy:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
operator:
  replicas: 1
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
rollOutCiliumPods: true
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
encryption:
  enabled: true
  type: wireguard
  nodeEncryption: false
  strictMode:
    egress:
      enabled: true
      cidr: 10.65.0.0/16
      allowRemoteNodeIdentities: true
    ingress:
      enabled: true
prometheus:
  enabled: true
hubble:
  enabled: true
  metrics:
    enableOpenMetrics: false
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - icmp
      - port-distribution
      - policy:sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity;labelsContext=source_namespace,destination_namespace
  export:
    static:
      enabled: true
      filePath: /var/log/hubble/egress-flows.log
      allowList:
        - '{"event_type":[{"type":5}],"traffic_direction":["EGRESS"]}'
        - '{"event_type":[{"type":1}]}'
      denyList:
        - '{"source_label":["reserved:host"]}'
      fieldMask:
        - time
        - node_name
        - verdict
        - drop_reason_desc
        - traffic_direction
        - policy_match_type
        - source.namespace
        - source.pod_name
        - source.workloads
        - source.identity
        - destination.namespace
        - destination.pod_name
        - destination.workloads
        - destination.identity
        - destination_names
        - IP.destination
        - l4
        - egress_allowed_by
        - egress_denied_by
      fileMaxSizeMb: 10
      fileMaxBackups: 5
  relay:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
  tls:
    auto:
      method: cronJob
certgen:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
extraHostPathMounts:
  - name: hubble-egress-flows
    mountPath: /var/log/hubble
    hostPath: /var/log/hubble
    hostPathType: DirectoryOrCreate
    readOnly: false
