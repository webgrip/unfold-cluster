---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 1h
  releaseName: cilium
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: cilium
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  valuesFrom:
    - kind: ConfigMap
      name: cilium-values
      valuesKey: values.yaml
