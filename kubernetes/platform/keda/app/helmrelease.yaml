---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
spec:
  interval: 1h
  releaseName: keda
  timeout: 15m
  chart:
    spec:
      chart: keda
      version: 2.21.0
      sourceRef:
        kind: HelmRepository
        name: kedacore
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: uninstall
      remediateLastFailure: true
  values:
    crds:
      install: true
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    http:
      timeout: 30000
    image:
      pullPolicy: IfNotPresent
      keda:
        registry: ghcr.io
        repository: kedacore/keda
        # renovate: datasource=docker depName=ghcr.io/kedacore/keda
        tag: 2.21.0@sha256:81fe6547ce8d1cc29273f887b76507e9b853e5bc1f875ec23fe60061a38ed809
      metricsApiServer:
        registry: ghcr.io
        repository: kedacore/keda-metrics-apiserver
        # renovate: datasource=docker depName=ghcr.io/kedacore/keda-metrics-apiserver
        tag: 2.21.0@sha256:255375037fe592732eeb554743aae360c2da88cf0b9b1258d0a987ef885f0881
      webhooks:
        registry: ghcr.io
        repository: kedacore/keda-admission-webhooks
        # renovate: datasource=docker depName=ghcr.io/kedacore/keda-admission-webhooks
        tag: 2.21.0@sha256:e1969628cca6123e32eea13c47c75817091af2657fa68d9d0d58a8620d1b75b1
    operator:
      replicaCount: 1
    metricsServer:
      replicaCount: 1
    webhooks:
      replicaCount: 1
    resources:
      operator:
        requests:
          cpu: 50m
          memory: 192Mi
        limits:
          cpu: null
          memory: 512Mi
          ephemeral-storage: 256Mi
      metricServer:
        requests:
          cpu: 20m
          memory: 96Mi
        limits:
          cpu: null
          memory: 256Mi
          ephemeral-storage: 256Mi
      webhooks:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          cpu: null
          memory: 128Mi
          ephemeral-storage: 256Mi
