---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-proxy-removal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-proxy-removal
rules:
  - apiGroups:
      - apps
    resources:
      - daemonsets
    resourceNames:
      - kube-proxy
    verbs:
      - get
      - delete
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    resourceNames:
      - kube-proxy
    verbs:
      - get
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-proxy-removal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-proxy-removal
subjects:
  - kind: ServiceAccount
    name: kube-proxy-removal
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-proxy-removal
rules:
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterrolebindings
    resourceNames:
      - kube-proxy
    verbs:
      - get
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-proxy-removal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-proxy-removal
subjects:
  - kind: ServiceAccount
    name: kube-proxy-removal
    namespace: kube-system
